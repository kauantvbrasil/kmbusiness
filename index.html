<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Vendas</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vendas">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#050609;--card:#101217;--tx:#f2f5fb;--mu:#98a3b7;--bd:#242c39;--pri:#184a91;--ok:#53d2a1;--bad:#ff737b;--warn:#f5b85e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#0b0d12;--card:#151a22;--tx:#f4f6fc;--mu:#a1acc1;--bd:#2b3443;--pri:#20599e;--ok:#53d2a1;--bad:#ff737b;--warn:#f5b85e;color-scheme:dark}
:root[data-theme="dark"]{--bg:#050609;--card:#101217;--tx:#f2f5fb;--mu:#98a3b7;--bd:#242c39;--pri:#184a91;--ok:#53d2a1;--bad:#ff737b;--warn:#f5b85e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 110% -5%,rgba(20,61,111,.23),transparent 45%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;letter-spacing:-.03em}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:linear-gradient(146deg,rgba(23,30,40,.89),rgba(12,14,19,.97));border:1px solid rgba(105,144,198,.17);border-radius:16px;padding:13px;box-shadow:0 6px 24px rgba(0,0,0,.23)}
.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:700;margin-top:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.item{margin-bottom:8px}.sub{font-size:12.5px;color:var(--mu)}
button,.btn{font:inherit;border:1px solid rgba(81,135,201,.25);border-radius:10px;padding:9px 13px;background:linear-gradient(145deg,#1d559c,#123565);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:rgba(30,55,90,.28);color:var(--tx);border:1px solid rgba(97,149,213,.18)}button.r{background:transparent;color:var(--bad);padding:4px 8px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--bd)}
.chip.bad{background:var(--bad);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,13,20,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px;border-radius:8px}
nav button b{display:block;font-size:19px}nav button.on{color:var(--pri);background:rgba(42,125,244,.09)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(145deg,#17202d,#0b0d12);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:#0b1018;color:var(--tx)}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.inst{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:13.5px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 0 10px;padding:8px 2px 10px;border-bottom:1px solid rgba(72,110,165,.35)}
.day-head strong{font-size:15px;letter-spacing:.025em}.day-head small{font-size:11px;color:var(--mu)}
.sale-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.02em;font-weight:700;border-radius:18px;padding:4px 9px;background:rgba(216,149,45,.12);color:var(--warn);border:1px solid rgba(216,149,45,.2)}
.sale-status.done{background:rgba(64,176,130,.1);color:var(--ok);border-color:rgba(64,176,130,.2)}
.sale-closed{opacity:.76}
.glass{background:linear-gradient(130deg,rgba(22,58,109,.4),rgba(8,14,25,.36));border:1px solid rgba(80,138,219,.23);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* K&M Insights: somente interface e calculos locais */
.section-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0}.section-top h1{margin:0}
.pillbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:13px 0}.pillbar button{font-size:12px;padding:10px 3px;background:#111a26;color:#9fb0cb}.pillbar button.active{background:linear-gradient(130deg,#164075,#0a213c);color:#fff;border-color:#3d6fa7}
.hero-panel{background:linear-gradient(145deg,#121d2b,#090d13 64%);border:1px solid rgba(71,121,183,.32);border-radius:20px;padding:19px;box-shadow:inset 0 1px 0 #35517735,0 10px 38px #0005}
.hero-panel .hero-label{font-size:11px;letter-spacing:1.8px;color:#8da3c0;text-transform:uppercase}
.hero-panel .hero-value{font-size:32px;font-weight:800;letter-spacing:-1px;margin:5px 0}
.spark{display:flex;align-items:end;height:88px;gap:8px;border-bottom:1px solid #24344b;margin-top:14px}.spark .spark-col{flex:1;min-width:0;text-align:center}.spark .spark-bar{background:linear-gradient(0deg,#102d50,#3778b7);border-radius:6px 6px 1px 1px;min-height:3px;margin:auto;width:75%}.spark .spark-label{color:#91a3bc;font-size:9px;margin:5px 0 3px}
.delta{display:inline-flex;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;background:#13273c;color:#9cc6fb}.delta.down{background:#301c28;color:#ff9baa}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.quick{display:block;text-align:left;background:linear-gradient(140deg,#172438,#0d1119);border:1px solid #2a3c54;padding:14px;border-radius:14px}.quick small{display:block;color:#95a7bf;font-size:11px;margin-top:4px}
.finance-day{background:rgba(21,38,60,.5);border:1px solid #2a415e;border-radius:12px;padding:12px;margin:9px 0}.finance-day.today{border-color:#437cb6}
.finance-day .sum{display:flex;justify-content:space-between;gap:10px;align-items:center}.finance-day .sum strong{font-size:14px}.finance-day .sum small{color:var(--mu);font-size:11px}
.finance-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #273647;padding:9px 0;font-size:12px}
.finance-entry:first-of-type{margin-top:8px}
.toolbar-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.toolbar-filters select,.toolbar-filters input{min-width:0}
.mini-meta{font-size:11px;color:var(--mu);margin:7px 0}.receipt-card{display:flex;justify-content:space-between;align-items:center;gap:10px}.receipt-card b{display:block}
@media(max-width:390px){.pillbar{gap:4px}.pillbar button{font-size:11px}.hero-panel .hero-value{font-size:27px}}

/* KM COMMAND CENTER: exclusivamente apresentacao / consultas em memoria */
:root{--kmglass:rgba(19,42,69,.44)}
body{background:radial-gradient(circle at 95% -7%,rgba(16,52,99,.2),transparent 36%),#050608}
.card,.hero-panel,.finance-day{transition:border-color .18s ease,transform .18s ease}
.card:focus-within{border-color:#315078}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #70adff;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.km-badge{display:inline-block;border:1px solid #284c76;background:rgba(25,62,111,.25);border-radius:30px;color:#9cc5f0;font-size:11px;padding:4px 10px}
.km-head{margin:7px 0 17px;padding:20px;border:1px solid #27466c;border-radius:20px;background:linear-gradient(120deg,rgba(24,53,87,.6),rgba(6,9,14,.96) 67%);box-shadow:0 14px 30px #0004}
.km-head h1{font-size:25px;margin:10px 0 4px}.km-head p{color:#9baec7;font-size:12px;margin:0}
.km-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;margin:13px -1px 16px;padding-bottom:7px}
.km-tabs button{flex:none;font-size:12px;padding:9px 12px;background:#0b1018;color:#a1b2c7;border:1px solid #26364b;white-space:nowrap}
.km-tabs button.on{background:linear-gradient(135deg,#17395e,#0c2038);border-color:#3a638e;color:#fff}
.km-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0}
.km-kpi{padding:14px;border-radius:15px;border:1px solid rgba(58,106,165,.24);background:linear-gradient(145deg,#111b2a,#0a0d12)}
.km-kpi span{display:block;font-size:11px;color:#9aacc3}.km-kpi strong{display:block;font-size:19px;margin:5px 0;overflow-wrap:anywhere}.km-kpi small{font-size:10px;color:#91abc5}
.km-chart{padding:15px;border:1px solid #263c57;border-radius:15px;background:linear-gradient(145deg,rgba(16,33,53,.68),rgba(8,10,14,.96));margin:10px 0}
.km-chartline{display:grid;grid-template-columns:minmax(74px,1fr) 2.4fr auto;gap:9px;align-items:center;font-size:12px;margin:10px 0}
.km-chartline .track{background:#182534;height:9px;border-radius:8px;overflow:hidden}.km-chartline .fill{height:100%;background:linear-gradient(90deg,#204d7b,#65a4df);border-radius:8px}
.km-chartline label{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#c8d7ea}
.km-chartline b{font-size:11px;font-variant-numeric:tabular-nums}
.km-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px}.km-selector label{margin-top:4px}
.km-report{padding:15px;border:1px solid #263c55;border-radius:14px;background:rgba(11,17,27,.78);margin:11px 0}
.km-report h3{font-size:13px;margin:0 0 12px;color:#bdd5f2}.km-report .inst{gap:8px}.km-report .inst span:first-child{min-width:0;overflow-wrap:anywhere}
.km-banner{border-left:3px solid #31689d;padding:10px 12px;margin:9px 0;background:rgba(24,62,107,.15);font-size:12px;color:#b5c8de}
.km-notice{padding:12px;background:rgba(61,95,137,.13);border:1px solid #2c4562;border-radius:12px;margin:10px 0;color:#b9cbe0;font-size:12px}
.km-compact .card.item{padding:8px 10px;margin-bottom:5px;border-radius:10px}.km-compact .thumb{height:38px;width:38px}
.km-chip{padding:3px 7px;background:#15263b;border-radius:8px;color:#9cc3ed;font-size:11px}
@media(min-width:700px){main{max-width:840px}.km-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.card,.hero-panel,.finance-day{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Nova venda">+</button>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="login"></div>
<script>
const KEY="agenda_vendas_v1";
let S={products:[],sales:[]},tab="home",filter="";
let insightsPeriod="day",insightsOffset=0,saleFilter="all",saleDateFilter="",stockSmart="default",financeOffset=0,receiptSearch="";
let kmPanel="executive",kmSpan="month",kmSpanOffset=0,kmStockMode="value",kmSearch="",kmCustomerQuery="",kmCritical=1,kmCompact=false,kmCatalogCompact=false,kmDateFrom="",kmDateTo="",kmMinPrice="",kmMaxPrice="",kmCalendarMode="due";
let stockSort="default",catalogSort="default"; // Preferências apenas visuais, nunca sincronizadas
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
for(const k of["expenses","closings","config","proofs","catalog","cphotos"])if(!Array.isArray(S[k]))S[k]=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSave()};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date());
const fmt=s=>s.split("-").reverse().slice(0,2).join("/");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const addDate=(s,i,mode)=>{const d=new Date(s+"T12:00:00");if(mode==="w")d.setDate(d.getDate()+7*i);else if(mode==="q")d.setDate(d.getDate()+15*i);else{const dd=d.getDate();d.setMonth(d.getMonth()+i);if(d.getDate()!==dd)d.setDate(0)}return iso(d)};
const paid=s=>s.inst.filter(i=>i.paid).reduce((a,i)=>a+i.v,0);
const status=i=>i.paid?"ok":i.d<today()?"bad":i.d===today()?"warn":"";

function stats(){
  let sold=0,cost=0,rec=0,open=0,late=0;
  S.sales.forEach(s=>{sold+=s.price;cost+=s.cost;const p=paid(s);rec+=p;open+=s.price-p;s.inst.forEach(i=>{if(!i.paid&&i.d<today())late+=i.v})});
  return{sold,cost,rec,open,late,profit:sold-cost,real:rec-cost};
}
function allInst(){const a=[];S.sales.forEach(s=>s.inst.forEach((i,n)=>a.push({s,i,n})));return a}

function render(){
  $("nav").innerHTML=[["home","📊","Início"],["cobr","🗓️","Cobranças"],["sales","🧾","Vendas"],["prod","📦","Pods"],["more","⚙️","Mais"]]
   .map(([k,e,t])=>`<button class="${tab===k||(k==="more"&&(tab==="km"||tab==="insights"||tab==="calendar"||tab==="receipts"||tab==="command"))?"on":""}" onclick="go('${k}')"><b>${e}</b>${t}</button>`).join("");
  $("fab").style.display=(tab==="prod"||tab==="more"||["km","insights","calendar","receipts","command"].includes(tab))?"none":"block";
  if(tryClose())save();
  $("app").innerHTML={home,cobr,sales,prod,more,km,insights,calendarFinance,receipts,command:kmCommand}[tab]();
}
const go=t=>{tab=t;render();scrollTo(0,0)};

function home(){
  const t=stats(),all=allInst().filter(x=>!x.i.paid).sort((a,b)=>a.i.d.localeCompare(b.i.d));
  const hoje=all.filter(x=>x.i.d===today()),atr=all.filter(x=>x.i.d<today());
  const m=today().slice(0,7);
  const mesRec=allInst().filter(x=>x.i.paid&&(x.i.pd||x.i.d).slice(0,7)===m).reduce((a,x)=>a+x.i.v,0);
  const mesVend=S.sales.filter(s=>s.date.slice(0,7)===m).length;
  const top={};S.sales.forEach(s=>{top[s.name]=(top[s.name]||0)+1});
  const best=Object.entries(top).sort((a,b)=>b[1]-a[1])[0];
  const low=S.products.filter(p=>(+p.stock||0)<=1).sort((a,b)=>(a.stock-b.stock)||byName(a,b));
  const gr={};S.sales.forEach(s=>{const p=S.products.find(x=>x.id===s.pid),k=rk==="mod"&&p&&p.brand&&p.model?p.brand+" "+p.model:s.name;(gr[k]=gr[k]||{n:0,l:0}).n++;gr[k].l+=s.price-s.cost});
  const rank=Object.entries(gr).sort((a,b)=>b[1].n-a[1].n||b[1].l-a[1].l).slice(0,6);
  return`<h1>Minhas vendas</h1>
  <div class="grid">
   <div class="card"><div class="k">Total vendido</div><div class="v">${money(t.sold)}</div></div>
   <div class="card"><div class="k">Quanto paguei (custo)</div><div class="v">${money(t.cost)}</div></div>
   <div class="card"><div class="k">Lucro previsto</div><div class="v ${t.profit>=0?"ok":"bad"}">${money(t.profit)}</div></div>
   <div class="card"><div class="k">Lucro real (recebido − custo)</div><div class="v ${t.real>=0?"ok":"bad"}">${money(t.real)}</div></div>
   <div class="card"><div class="k">Já recebi</div><div class="v ok">${money(t.rec)}</div></div>
   <div class="card"><div class="k">A receber</div><div class="v warn">${money(t.open)}</div></div>
  </div>
  ${t.late>0?`<div class="card item" style="margin-top:10px;border-color:var(--bad)"><b class="bad">⚠️ ${money(t.late)} em atraso</b><div class="sub">${atr.length} parcela(s) vencida(s)</div></div>`:""}
  <button class="quick" onclick="go('command')" style="width:100%;margin:14px 0"><b>◆ K&M Command Center</b><small>34 melhorias de gestão · análises sem gravação na nuvem</small></button>
  <button class="quick" onclick="go('insights')" style="width:100%;margin:14px 0"><b>◈ K&M Insights</b><small>Resumo diário, semanal, quinzenal e mensal · Comparativo de vendas</small></button>
  ${kmCard()}
  <h2>Hoje (${hoje.length})</h2>${hoje.length?hoje.map(instRow).join(""):`<div class="empty">Nada vence hoje 🎉</div>`}
  <h2>Atrasadas (${atr.length})</h2>${atr.length?atr.slice(0,5).map(instRow).join(""):`<div class="empty">Nenhuma atrasada</div>`}
  ${S.products.length?`<h2>Estoque baixo (${low.length})</h2>${low.length?low.slice(0,8).map(p=>`<div class="card item"><div class="row"><b class="grow">${esc(p.name)}</b><b class="${p.stock<=0?"bad":"warn"}">${p.stock<=0?"Sem estoque":"Resta "+p.stock}</b></div></div>`).join("")+(low.length>8?`<div class="sub">+ ${low.length-8} na aba Pods</div>`:""):`<div class="empty">Estoque em dia 👍</div>`}`:""}
  <h2>Mais vendidos</h2><div class="row" style="margin-bottom:8px"><button class="${rk==="pod"?"":"g"}" onclick="rk='pod';render()">Por sabor</button><button class="${rk==="mod"?"":"g"}" onclick="rk='mod';render()">Por modelo</button></div>
  ${rank.length?rank.map(([k,v])=>`<div class="card item"><div class="row"><b class="grow">${esc(k)}</b><span class="sub">${v.n} venda${v.n>1?"s":""} · lucro <b class="${v.l>=0?"ok":"bad"}">${money(v.l)}</b></span></div></div>`).join(""):`<div class="empty">Ainda sem vendas.</div>`}
  <h2>Este mês</h2><div class="card"><div class="sub">Vendas feitas: <b>${mesVend}</b> · Recebido: <b class="ok">${money(mesRec)}</b>${best?` · Mais vendido: <b>${esc(best[0])}</b> (${best[1]})`:""}</div></div>`;
}
function instRow(x){
  const {s,i,n}=x,st=status(i),dias=Math.round((new Date(i.d)-new Date(today()))/864e5);
  const lbl=i.paid?"Pago":st==="bad"?`${-dias}d atraso`:st==="warn"?"Hoje":`em ${dias}d`;
  const msg=encodeURIComponent(`Oi ${s.client}! Passando para lembrar da parcela ${n+1}/${s.inst.length} (${money(i.v)}) do ${s.name}, vencimento ${fmt(i.d)}. Obrigado!`);
  const ph=(s.phone||"").replace(/\D/g,"");
  return`<div class="card item"><div class="row">${thumb(s)}<div class="grow"><b>${esc(s.client||"Sem nome")}</b> <span class="chip ${st}">${lbl}</span>
  <div class="sub">${esc(s.name)} · parcela ${n+1}/${s.inst.length} · ${fmt(i.d)}</div><div><b>${money(i.v)}</b></div></div>
  <div style="display:grid;gap:6px">${i.paid?"":`<button onclick="pay('${s.id}',${n})">✓ Pago</button>`}${ph&&!i.paid?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/55${ph}?text=${msg}">💬 Cobrar</a>`:""}${i.paid?"":`<a class="btn g" target="_blank" rel="noopener" href="${gcal(s,i,n)}">📅 Agenda</a>`}${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾 Ver":"＋ 🧾"}</button>`:""}</div></div></div>`;
}
const gcal=(s,i,n)=>{const d=new Date(i.d+"T12:00:00");d.setDate(d.getDate()+1);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("💰 Receber "+money(i.v)+" - "+(s.client||"cliente"))+"&dates="+i.d.replace(/-/g,"")+"/"+iso(d).replace(/-/g,"")+"&details="+encodeURIComponent(s.name+" · parcela "+(n+1)+"/"+s.inst.length)};

function sales(){

const periodWindow=(type,off=0)=>{
  const now=today(),dt=dateObj(now),y=dt.getFullYear(),m=dt.getMonth(),day=dt.getDate();
  let start,end;

    const monday=addDays(now,-((dt.getDay()+6)%7)+off*7);
    start=monday;end=addDays(monday,6);

    const half=day<=15?0:1;
    const index=y*24+m*2+half+off,yy=Math.floor(index/24),mm=Math.floor((index%24+24)%24/2),hh=((index%2)+2)%2;
    start=iso(new Date(yy,mm,hh?16:1,12));end=iso(new Date(yy,mm,hh?new Date(yy,mm+1,0).getDate():15,12));
  }else{start=iso(new Date(y,m+off,1,12));end=iso(new Date(y,m+off+1,0,12))}

 const volume=sumList(scores,x=>x.n),abc=[...scores].sort((a,b)=>b.n-a.n),sum={},vocab=["A","B","C"];

 else if(which==="stock"){name="estoque";rows=[["Marca","Modelo","Produto","Quantidade","Custo unitario","Preco unitario"],...S.products.map(p=>[p.brand,p.model,p.name,p.stock,p.cost,p.price])]}
 else{name="clientes";rows=[["Cliente","Telefone","Compras","Total","Recebido"],...kmVisits().map(c=>[c.client,c.phone,c.sales.length,c.total,c.received])]}
 const csv='\ufeff'+rows.map(row=>row.map(kmCsvCell).join(';')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=`KM_${name}_${today()}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);

let db=null,au=null,cloudOn=false,unsubs=[],last={products:{},sales:{},catalog:{},cphotos:{},expenses:{},closings:{},config:{},proofs:{}},ready={};
function cloudSave(){
  if(!db||!cloudOn)return;
  ["products","sales","catalog","cphotos","expenses","closings","config","proofs"].forEach(c=>{
    const cur={};(S[c]||[]).forEach(x=>cur[x.id]=JSON.stringify(x));
    Object.keys(cur).forEach(id=>{if(last[c][id]!==cur[id]){last[c][id]=cur[id];db.collection(c).doc(id).set(JSON.parse(cur[id])).catch(e=>console.error(e))}});
    Object.keys(last[c]).forEach(id=>{if(!(id in cur)){delete last[c][id];db.collection(c).doc(id).delete().catch(e=>console.error(e))}});
  });
}
function listen(){
  unsubs.forEach(f=>f());
  unsubs=["products","sales","catalog","cphotos","expenses","closings","config","proofs"].map(c=>db.collection(c).onSnapshot(sn=>{
    const a=[];last[c]={};
    sn.forEach(d=>{const x=d.data();x.id=d.id;a.push(x);last[c][d.id]=JSON.stringify(x)});
    S[c]=a;if(!sn.metadata.fromCache)ready[c]=1;if(c==="catalog"&&!a.length&&!sn.metadata.fromCache){S.catalog=seedCat();cloudSave()}if(!sn.metadata.fromCache&&migAll())cloudSave();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!$("modal").innerHTML&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();
  },e=>console.error(e)));
}

}

  const e=$("le").value.trim(),p=$("lp").value;
  (n?au.createUserWithEmailAndPassword(e,p):au.signInWithEmailAndPassword(e,p)).catch(x=>$("lm").textContent="Não deu: "+x.code);

function initCloud(){
  if(FB.apiKey.startsWith("COLE")||!window.firebase)return;
  firebase.initializeApp(FB);au=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  au.onAuthStateChanged(u=>{
    if(u){
      cloudOn=true;$("login").innerHTML="";
      try{if(!localStorage.getItem(KEY+"_m")){cloudSave();localStorage.setItem(KEY+"_m","1")}}catch(e){}
      listen();render();
    }else{cloudOn=false;unsubs.forEach(f=>f());unsubs=[];loginUI()}
  });
}

render();initCloud();
