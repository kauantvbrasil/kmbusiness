<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#161a23;--mu:#6b7280;--bd:#e4e6ec;--pri:#1677ff;--ok:#12a150;--bad:#e5484d;--warn:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#eef0f6;--mu:#98a0b3;--bd:#2a2e3b;--pri:#3696ff;--ok:#3ccf85;--bad:#ff6b6f;--warn:#f0b13a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#eef0f6;--mu:#98a0b3;--bd:#2a2e3b;--pri:#3696ff;--ok:#3ccf85;--bad:#ff6b6f;--warn:#f0b13a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:700;margin-top:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.item{margin-bottom:8px}.sub{font-size:12.5px;color:var(--mu)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--bd);color:var(--tx)}button.r{background:transparent;color:var(--bad);padding:4px 8px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--bd)}
.chip.bad{background:var(--bad);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px;border-radius:8px}
nav button b{display:block;font-size:19px}nav button.on{color:var(--pri)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.inst{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:13.5px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}

/* K&M OPERACOES: cinco modulos */
.opsbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 14px}
.opsbtn{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px;min-width:0}
.opsbtn strong{font-size:13px;display:block}.opsbtn small{display:block;font-size:11px;font-weight:400;color:var(--mu);padding-top:2px}
.opsbtn em{font-size:23px;font-style:normal;flex:none}.opsbtn.urgent{border-color:var(--bad)}
.metric{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;min-width:0}
.metric .label{color:var(--mu);font-size:12px}.metric .number{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.opsnote{border-left:3px solid var(--pri);background:var(--card);padding:10px 12px;border-radius:9px;font-size:12px;color:var(--mu);margin:10px 0}
.twoCols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opslist{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.opslist>*{min-width:0}.opslist:last-child{border-bottom:none}
.positive{color:var(--ok)}.negative{color:var(--bad)}
.priority{border-left:4px solid var(--bd)}.priority.crit{border-left-color:var(--bad)}.priority.medium{border-left-color:var(--warn)}
.tiny{font-size:11px;color:var(--mu)}.badgecount{border-radius:50px;padding:3px 8px;background:var(--bad);color:white;font-size:11px;font-weight:bold}
@media(max-width:375px){.opsbar{grid-template-columns:1fr 1fr}.opsbtn{padding:10px;align-items:flex-start}.opsbtn em{font-size:20px}.metric .number{font-size:19px}}
/* K&M Pro: responsive interface */
:root{--brand:#1677ff;--brand2:#00c2ff}
body{font-size:15px}main{max-width:900px;padding:16px 14px 26px}

.brandmark img{display:block;width:100%;height:100%;object-fit:contain}

.hero .heroact button{background:#fff;color:#122d63;font-size:13px}
.hero .heroact button.alt{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.2)}
.health{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:12px;color:#c7dfff;position:relative;z-index:1}
.health .dot{width:8px;height:8px;border-radius:50%;background:#f3bd45}
.health.ready .dot{background:#45e39b}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px}

.statline{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.statline .chip{font-size:12px;padding:6px 10px}
.smallbtn{padding:8px 10px;font-size:12px;white-space:nowrap}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;background:var(--bd);color:var(--tx);padding:4px 9px;font-size:11px}
.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{border-bottom:1px solid var(--bd);padding:9px;text-align:left;vertical-align:top}.table th{color:var(--mu)}

body{padding-bottom:94px}nav{max-width:900px;margin:auto;left:0;right:0;border:1px solid var(--bd);border-bottom:0;border-radius:16px 16px 0 0}
nav button{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10px}nav button b{font-size:20px}

.card .v{overflow-wrap:anywhere}input,select,textarea{font-size:16px;min-height:42px}button,.btn{min-height:39px}

<body><div id="km-brand">K&M <span>BUSINESS 3.0</span><small id="km-info">Central de gestão</small></div><div id="km-shade"></div><button id="km-menu" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>

<script>
const KEY="agenda_vendas_v1";
let S={products:[],sales:[]},tab="home",filter="";
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
for(const k of["expenses","closings","config","proofs","catalog","cphotos","clients","history","recurring"])if(!Array.isArray(S[k]))S[k]=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSave();scheduleAutoBackup()};
// Backups automáticos locais: IndexedDB guarda até 7 versões, no próprio aparelho.
const AUTO_DB='KM_Imports_Backups_v1';
let autoBackupTimer=null,autoBackupBusy=false;
const backupReady=()=>!cloudOn||['products','sales','catalog','cphotos','expenses','closings','config','proofs','clients','history','recurring'].every(k=>ready[k]);
function backupStore(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB indisponível'));const req=indexedDB.open(AUTO_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'at'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function autoBackupNow(){if(autoBackupBusy||!backupReady()||!S.sales||!S.products)return false;autoBackupBusy=true;let db;
 try{db=await backupStore();const at=new Date().toISOString(),payload=JSON.stringify({version:3,exportedAt:at,automatic:true,data:S});await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite'),st=tx.objectStore('snapshots');st.put({at,payload});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 const all=await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readonly'),r=tx.objectStore('snapshots').getAllKeys();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
 const obsolete=all.sort().slice(0,-7);if(obsolete.length)await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite');for(const k of obsolete)tx.objectStore('snapshots').delete(k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 try{localStorage.setItem('KM_last_auto_backup',at)}catch(e){}return true;
 }catch(e){console.warn('Backup local automático falhou:',e);return false}finally{db?.close();autoBackupBusy=false}}
function scheduleAutoBackup(){if(autoBackupTimer)clearTimeout(autoBackupTimer);autoBackupTimer=setTimeout(()=>{autoBackupTimer=null;autoBackupNow()},5000)}
async function listAutoBackups(){let db;try{db=await backupStore();return await new Promise((resolve,reject)=>{const r=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>b.at.localeCompare(a.at)));r.onerror=()=>reject(r.error)})}finally{db?.close()}}
async function showAutoBackups(){try{const items=await listAutoBackups();modal(`<h1>🛟 Cópias automáticas</h1><div class="sub">Até 7 versões guardadas neste aparelho. Não são backups externos. Para segurança real, baixe um JSON e guarde fora do celular.</div>${items.length?items.map((b,i)=>`<div class="card item"><b>${esc(new Date(b.at).toLocaleString('pt-BR'))}</b><div class="wrap" style="margin-top:8px"><button class="g" onclick="exportAutoBackup(${i})">Baixar</button>${!cloudOn?`<button class="g" onclick="restoreAutoBackup(${i})">Restaurar local</button>`:''}</div></div>`).join(''):'<div class="empty">Nenhuma cópia automática disponível.</div>'}<button class="g" onclick="closeM()">Fechar</button>`)}catch(e){alert('Não foi possível ler os backups: '+e.message)}}
async function exportAutoBackup(i){const b=(await listAutoBackups())[i];if(!b)return;const blob=new Blob([b.payload],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KM-auto-'+b.at.slice(0,19).replace(/[:T]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function restoreAutoBackup(i){if(cloudOn)return alert('Restauração automática bloqueada enquanto conectado ao Firebase.');const b=(await listAutoBackups())[i];if(!b)return;const d=JSON.parse(b.payload).data;if(!Array.isArray(d.sales)||!Array.isArray(d.products))return alert('Backup inválido.');if(!confirm('Substituir todos os dados LOCAIS pela cópia de '+new Date(b.at).toLocaleString('pt-BR')+'?'))return;S=d;for(const k of ['expenses','closings','config','proofs','catalog','cphotos','clients','history','recurring'])if(!Array.isArray(S[k]))S[k]=[];save();closeM();render()}
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date());
const fmt=s=>s.split("-").reverse().slice(0,2).join("/");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const addDate=(s,i,mode)=>{const d=new Date(s+"T12:00:00");if(mode==="w")d.setDate(d.getDate()+7*i);else if(mode==="q")d.setDate(d.getDate()+15*i);else{const dd=d.getDate();d.setMonth(d.getMonth()+i);if(d.getDate()!==dd)d.setDate(0)}return iso(d)};
const paid=s=>(s.inst||[]).filter(i=>i.paid).reduce((a,i)=>a+(+i.v||0),0);
const safeNum=v=>Number.isFinite(+v)?+v:0;
const dateLabel=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.split('-').reverse().join('/'):esc(s);
const userTag=()=>au&&au.currentUser?(au.currentUser.email||'Usuário'):'Modo local';
const getBrandLogo=()=>S.config.find(x=>x.id==='brand_logo')?.img||'';
const logoHtml=()=>getBrandLogo()?`<img src="${getBrandLogo()}" alt="Logotipo K&M Imports">`:'K&M';
const logEvent=(type,detail,ref='')=>{const item={id:uid(),at:new Date().toISOString(),actor:userTag(),type,detail:String(detail).slice(0,240),ref};S.history.unshift(item);S.history=S.history.slice(0,800)};
const getSnapshotState=()=>cloudOn&&db?'Nuvem conectada':'Dados locais';
const cloudMsg=()=>cloudOn?(!Object.keys(ready).length?'Conectando ao banco...':Object.keys(ready).length<11?'Sincronizando dados...':'Conectado ao Firebase'):'Modo local (sem sincronização)';
const downloadText=(name,value,type='text/plain')=>{const b=new Blob([value],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
const csvFile=(name,rows)=>{const c=v=>{let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};downloadText(name,'\ufeff'+rows.map(r=>r.map(c).join(';')).join('\r\n'),'text/csv;charset=utf-8')};
const status=i=>i.paid?"ok":i.d<today()?"bad":i.d===today()?"warn":"";

function stats(){
  let sold=0,cost=0,rec=0,open=0,late=0;
  S.sales.forEach(s=>{sold+=s.price;cost+=s.cost;const p=paid(s);rec+=p;open+=s.price-p;s.inst.forEach(i=>{if(!i.paid&&i.d<today())late+=i.v})});
  const exp=S.expenses.reduce((a,x)=>a+(Number(x.v)||0),0);return{sold,cost,exp,rec,open,late,profit:sold-cost-exp,real:rec-cost-exp};
}
function allInst(){const a=[];S.sales.forEach(s=>s.inst.forEach((i,n)=>a.push({s,i,n})));return a}

function render(){
  $("nav").innerHTML=[["home","📊","Início"],["cobr","🗓️","Cobranças"],["sales","🧾","Vendas"],["prod","📦","Estoque"],["clients","👥","Clientes"],["more","⚙️","Mais"]]
   .map(([k,e,t])=>`<button class="${tab===k||(k==="more"&&["km","reports","ledger","recurring","daily","partners","inventory","alerts","forecast"].includes(tab))?"on":""}" onclick="go('${k}')"><b>${e}</b>${t}</button>`).join("");
  $("fab").style.display=(["home","prod","more","km","clients","reports","ledger","recurring","daily","partners","inventory","alerts","forecast"].includes(tab))?"none":"block";
  if(tryClose())save();
  $("app").innerHTML={home,cobr,sales,prod,clients,more,km,reports,ledger,recurring,daily,partners,inventory,alerts,forecast}[tab]();
}
const go=t=>{tab=t;render();scrollTo(0,0)};


// K&M 3.0: camada visual adicional. Não modifica S, save, Firebase ou regras comerciais.
function kmDashboardPremium(){
 const allSales=Array.isArray(S.sales)?S.sales:[], products=Array.isArray(S.products)?S.products:[];
 const month=today().slice(0,7),monthSales=allSales.filter(s=>String(s.date||'').slice(0,7)===month);
 const total=monthSales.reduce((n,s)=>n+safeNum(s.price),0);
 const received=monthSales.reduce((n,s)=>n+paid(s),0);
 const pending=Math.max(0,allSales.reduce((n,s)=>n+safeNum(s.price)-paid(s),0));
 const avg=monthSales.length?total/monthSales.length:0;
 const now=new Date(today()+'T12:00:00'), points=[];
 for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const day=iso(d);points.push({day,value:allSales.filter(s=>s.date===day).reduce((n,s)=>n+safeNum(s.price),0)});}
 const max=Math.max(1,...points.map(p=>p.value)), coords=points.map((p,i)=>`${20+i*19},${180-(p.value/max)*146}`).join(' ');
 const area=`20,180 ${coords} ${20+29*19},180`;
 const low=products.filter(p=>!p.archived&&safeNum(p.stock)<=safeNum(p.minStock||1)).slice(0,4);
 const recent=allSales.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);
 const card=(icon,label,value,sub,accent='')=>`<div class="km-dash-kpi ${accent}"><div class="km-dash-kpi-icon">${icon}</div><div class="km-dash-kpi-label">${label}</div><strong>${value}</strong><small>${sub}</small></div>`;
 return `<section class="km-dash" aria-label="Dashboard executivo">
  <div class="km-dash-heading"><div><div class="km-dash-eyebrow">K&M BUSINESS 3.0 · PAINEL EXECUTIVO</div><h1>📊 Dashboard</h1><p>Visão geral do negócio · ${dateLabel(today())}</p></div><button class="km-dash-ghost" onclick="go('reports')">📈 Relatórios ↗</button></div>
  <div class="km-dash-search"><span>⌕</span><input aria-label="Pesquisar clientes, vendas e produtos" id="kmGlobalSearch" placeholder="Pesquisar cliente, venda, produto..." onkeydown="if(event.key==='Enter')kmSearchGlobal()"><button onclick="kmSearchGlobal()">Buscar</button></div>
  <div class="km-dash-kpis">
  ${card('▤','Faturamento (mês)',money(total),'Vendas registradas no mês')}
  ${card('▣','Vendas (mês)',String(monthSales.length),'Quantidade de vendas')}
  ${card('◇','Ticket médio',money(avg),'Média por venda')}
  ${card('◷','A receber',money(pending),'Saldo total em aberto','km-dash-danger')}
  </div>
  <div class="km-dash-mainrow"><section class="km-dash-panel"><div class="km-dash-panel-title"><b>↗ Vendas nos últimos 30 dias</b><span>Valores reais registrados</span></div><div class="km-chart-wrap"><svg viewBox="0 0 600 215" role="img" aria-label="Gráfico de vendas dos últimos 30 dias"><defs><linearGradient id="kmChartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#168cff" stop-opacity=".55"/><stop offset="1" stop-color="#168cff" stop-opacity=".02"/></linearGradient></defs><path d="M20 34H580 M20 70H580 M20 107H580 M20 144H580 M20 180H580" stroke="#28415b" stroke-width="1"/><polygon points="${area}" fill="url(#kmChartFill)"/><polyline points="${coords}" fill="none" stroke="#39b9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="207">${dateLabel(points[0].day)}</text><text x="510" y="207">${dateLabel(points[29].day)}</text></svg></div></section>
  <section class="km-dash-panel"><div class="km-dash-panel-title"><b>⚡ Ações rápidas</b></div><div class="km-dash-actions"><button class="primary" onclick="saleForm()">＋<span>Nova venda</span></button><button onclick="go('clients')">♙<span>Clientes</span></button><button onclick="go('prod')">▣<span>Estoque</span></button><button onclick="go('ledger')">▤<span>Financeiro</span></button><button onclick="go('cobr')">▦<span>Cobranças</span></button><button onclick="go('reports')">▥<span>Relatórios</span></button><button onclick="kmReceiptList()">▤<span>Recibos</span></button><button onclick="go('alerts')">♧<span>Alertas</span></button></div></section></div>
  <div class="km-dash-mainrow"><section class="km-dash-panel"><div class="km-dash-panel-title"><b>▤ Últimas vendas</b><button onclick="go('sales')">Ver todas →</button></div><div class="km-dash-list">${recent.length?recent.map(s=>`<div class="km-dash-listrow"><div><b>${esc(s.client||s.customer||s.buyer||s.name||'Venda registrada')}</b><small>${esc(s.date||'')} · ${esc(s.name||'')}</small></div><strong>${money(s.price)}</strong></div>`).join(''):'<p class="km-dash-empty">Nenhuma venda registrada.</p>'}</div></section>
  <section class="km-dash-panel"><div class="km-dash-panel-title"><b>▣ Estoque · Itens em atenção</b><button onclick="go('prod')">Ver estoque →</button></div><div class="km-dash-list">${low.length?low.map(p=>`<div class="km-dash-listrow"><div><b>${esc(p.name)}</b><small>Estoque atual: ${safeNum(p.stock)} · Mínimo: ${safeNum(p.minStock||1)}</small></div><span class="km-dash-alert">Estoque baixo</span></div>`).join(''):'<p class="km-dash-empty">Nenhum alerta de estoque.</p>'}</div></section></div>
  <div class="km-dash-original"><div class="km-dash-original-title"><h2>📋 Central completa do sistema antigo</h2><p>Todas as ferramentas e indicadores originais continuam disponíveis abaixo.</p></div></div>
 </section>`;
}
function kmSearchGlobal(){const el=document.getElementById('kmGlobalSearch');const q=el?.value?.trim();if(!q)return;window.kmGlobalTerm=q;go('sales');const input=document.querySelector('main input[type="search"],main input[placeholder*="Buscar"]');if(input){input.value=q;input.dispatchEvent(new Event('input',{bubbles:true}));}}
function home(){return kmDashboardPremium()+homeOriginal()}

function homeOriginal(){

  <div class="sectionhead"><h2 style="margin:0">Visão geral</h2><span class="badge">${S.sales.length} vendas registradas</span></div>
  <div class="grid">
   <div class="card"><div class="k">Total vendido</div><div class="v">${money(t.sold)}</div></div>
   <div class="card"><div class="k">Quanto paguei (custo)</div><div class="v">${money(t.cost)}</div></div>
   <div class="card"><div class="k">Resultado previsto (após despesas)</div><div class="v ${t.profit>=0?"ok":"bad"}">${money(t.profit)}</div></div>
   <div class="card"><div class="k">Recebido − custos − despesas*</div><div class="v ${t.real>=0?"ok":"bad"}">${money(t.real)}</div></div>
   <div class="card"><div class="k">Já recebi</div><div class="v ok">${money(t.rec)}</div></div>
   <div class="card"><div class="k">A receber</div><div class="v warn">${money(t.open)}</div></div>
  </div>

   <button class="opsbtn" onclick="go('inventory')"><span><strong>Inventário</strong><small>Contagem física do estoque</small></span><em>📦</em></button>
   <button class="opsbtn ${alertsData().some(a=>a.priority==='crit')?'urgent':''}" onclick="go('alerts')"><span><strong>Central de alertas</strong><small>${alertsData().length} pendência(s) encontradas</small></span><em>🔔</em></button>

function instRow(x){
  const {s,i,n}=x,st=status(i),dias=Math.round((new Date(i.d)-new Date(today()))/864e5);
  const lbl=i.paid?"Pago":st==="bad"?`${-dias}d atraso`:st==="warn"?"Hoje":`em ${dias}d`;
  const msg=encodeURIComponent(`Oi ${s.client}! Passando para lembrar da parcela ${n+1}/${s.inst.length} (${money(i.v)}) do ${s.name}, vencimento ${fmt(i.d)}. Obrigado!`);
  const ph=(s.phone||"").replace(/\D/g,"");
  return`<div class="card item"><div class="row">${thumb(s)}<div class="grow"><b>${esc(s.client||"Sem nome")}</b> <span class="chip ${st}">${lbl}</span>
  <div class="sub">${esc(s.name)} · parcela ${n+1}/${s.inst.length} · ${fmt(i.d)}</div><div><b>${money(i.v)}</b></div></div>
  <div style="display:grid;gap:6px">${i.paid?"":`<button onclick="pay('${s.id}',${n})">✓ Pago</button>`}${ph&&!i.paid?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/55${ph}?text=${msg}">💬 Cobrar</a>`:""}${i.paid?"":`<a class="btn g" target="_blank" rel="noopener" href="${gcal(s,i,n)}">📅 Agenda</a>`}${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾 Ver":"＋ 🧾"}</button>`:""}</div></div></div>`;
}
const gcal=(s,i,n)=>{const d=new Date(i.d+"T12:00:00");d.setDate(d.getDate()+1);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("💰 Receber "+money(i.v)+" - "+(s.client||"cliente"))+"&dates="+i.d.replace(/-/g,"")+"/"+iso(d).replace(/-/g,"")+"&details="+encodeURIComponent(s.name+" · parcela "+(n+1)+"/"+s.inst.length)};
const thumb=s=>s.img?`<img class="thumb" src="${s.img}" alt="">`:`<div class="thumb">💨</div>`;

function cobr(){
  const f=filter,list=allInst().filter(x=>f==="paid"?x.i.paid:f==="late"?(!x.i.paid&&x.i.d<today()):!x.i.paid).sort((a,b)=>a.i.d.localeCompare(b.i.d));
  return`<h1>Cobranças</h1><div class="row" style="margin-bottom:10px">
  ${[["","A receber"],["late","Atrasadas"],["paid","Pagas"]].map(([k,t])=>`<button class="${f===k?"":"g"}" onclick="filter='${k}';render()">${t}</button>`).join("")}</div>
  ${list.length?list.map(instRow).join(""):`<div class="empty">Nada por aqui</div>`}`;
}
let tmpProof="";
const getProof=(id,n)=>((S.proofs.find(x=>x.id===id+"_"+n))||{}).img||"";
function setProof(id,n,img){const k=id+"_"+n,j=S.proofs.findIndex(x=>x.id===k);if(!img){if(j>=0)S.proofs.splice(j,1)}else if(j>=0)S.proofs[j].img=img;else S.proofs.push({id:k,img})}
function pay(id,n){const s=S.sales.find(x=>x.id===id),i=s.inst[n];
  if(i.paid){i.paid=false;i.pd=null;save();render();return}
  tmpProof="";modal(`<h1>Marcar como pago</h1><div class="sub">${esc(s.client||"Sem nome")} · ${esc(s.name)} · parcela ${n+1}/${s.inst.length} · <b>${money(i.v)}</b></div>
  <label>Comprovante (foto, opcional)</label><div class="row"><img id="prv" class="thumb" style="width:72px;height:72px"><div class="grow"><input type="file" accept="image/*" onchange="readImg(this,d=>{tmpProof=d;prv.src=d},1000,.6)"></div></div>
  <div class="row" style="margin-top:14px"><button onclick="confirmPay('${id}',${n})">✓ Confirmar pagamento</button><button class="g" onclick="closeM()">Cancelar</button></div>`)}
function confirmPay(id,n){const i=S.sales.find(x=>x.id===id).inst[n];i.paid=true;i.pd=today();if(tmpProof)setProof(id,n,tmpProof);save();closeM();render()}
function proofForm(id,n){const im=getProof(id,n);modal(`<h1>🧾 Comprovante</h1>${im?`<img src="${im}" style="width:100%;border-radius:12px;margin:8px 0">`:`<div class="empty">Sem comprovante ainda.</div>`}
  <label>${im?"Trocar foto":"Adicionar foto"}</label><input type="file" accept="image/*" onchange="readImg(this,d=>{setProof('${id}',${n},d);save();closeM();render()},1000,.6)">
  <div class="row" style="margin-top:12px">${im?`<button class="r" onclick="setProof('${id}',${n},'');save();closeM();render()">Remover</button>`:""}<button class="g" onclick="closeM()">Fechar</button></div>`)}

function sales(){
  const q=(filter||"").toLowerCase();
  const list=[...S.sales].filter(s=>!q||(s.client+s.name).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
  return`<h1>Vendas</h1><input placeholder="🔍 Buscar cliente ou pod" value="${esc(filter)}" oninput="filter=this.value;render();document.querySelector('input').focus()">
  <div style="height:10px"></div>${list.length?list.map(s=>{
   const p=paid(s),pct=Math.min(100,p/s.price*100);
   return`<details class="card item"><summary style="list-style:none;cursor:pointer"><div class="row">${thumb(s)}<div class="grow"><b>${esc(s.name)}</b>
   <div class="sub">${esc(s.client||"Sem nome")} · ${fmt(s.date)} · ${esc(s.statusOrder||"Pendente")} · ${esc(s.sellerName||"Sem responsável")}</div>
   <div class="sub">Venda ${money(s.price)} · Custo ${money(s.cost)} · Lucro <b class="${s.price-s.cost>=0?"ok":"bad"}">${money(s.price-s.cost)}</b></div></div></div>
   <div class="bar"><i style="width:${pct}%"></i></div><div class="sub">Recebido ${money(p)} de ${money(s.price)}</div></summary>
   ${s.inst.map((i,n)=>`<div class="inst"><span>${n+1}ª · ${fmt(i.d)} · ${money(i.v)} <span class="chip ${status(i)}">${i.paid?"pago":status(i)==="bad"?"atrasada":"aberta"}</span></span><span class="row" style="gap:6px">${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾":"＋🧾"}</button>`:""}<button class="${i.paid?"g":""}" onclick="pay('${s.id}',${n})">${i.paid?"Desfazer":"Pago"}</button></span></div>`).join("")}
    <div class="sub">Pagamento: ${esc(s.paymentMethod||"Não informado")} · Entrega: ${esc(s.deliveryMethod||"Não informado")}${s.tracking?" · Referência: "+esc(s.tracking):""}</div>
    ${s.note?`<div class="sub" style="margin-top:6px">📝 ${esc(s.note)}</div>`:""}
   <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="g" onclick="kmReceipt('${s.id}')">🧾 Recibo</button><button class="g" onclick="saleForm('${s.id}')">✏️ Editar venda</button><button class="r" onclick="delSale('${s.id}')">Excluir venda</button></div></details>`}).join(""):`<div class="empty">Nenhuma venda ainda. Toque no + para registrar.</div>`}`;
}
function delSale(id){if(confirm("Excluir esta venda? O estoque vinculado será devolvido.")){const old=S.sales.find(s=>s.id===id);if(old&&old.pid){const p=S.products.find(x=>x.id===old.pid);if(p)p.stock=(+p.stock||0)+1;}S.sales=S.sales.filter(s=>s.id!==id);S.proofs=S.proofs.filter(x=>!x.id.startsWith(id+"_"));save();render()}}

const PROOF_FROM="2026-11-04",EXC=["Frete / entrega","Embalagem","Anúncios / marketing","Taxas (Pix, maquininha)","Equipamento","Outros"];
const pad=n=>String(n).padStart(2,"0"),dim=(y,m)=>new Date(y,m,0).getDate(),c30=(y,m)=>Math.min(30,dim(y,m));
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)};
const cyStart=d=>{const[y,m,dd]=d.split("-").map(Number);if(dd>=c30(y,m))return y+"-"+pad(m)+"-"+pad(c30(y,m));let py=y,pm=m-1;if(pm<1){pm=12;py--}return py+"-"+pad(pm)+"-"+pad(c30(py,pm))};
const nextStart=st=>{let[y,m]=st.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+pad(m)+"-"+pad(c30(y,m))};

function cyCalc(from,to){
  const sl=S.sales.filter(s=>s.date>=from&&s.date<=to),ex=S.expenses.filter(x=>x.date>=from&&x.date<=to);
  const sold=sumBy(sl,s=>s.price),cost=sumBy(sl,s=>s.cost),exp=sumBy(ex,x=>x.v);let rec=0;
  allInst().forEach(({i})=>{if(i.paid){const d=i.pd||i.d;if(d>=from&&d<=to)rec+=i.v}});
  const open=sumBy(sl,s=>sumBy(s.inst.filter(i=>!i.paid),i=>i.v)),bb={},ec={},tp={};
  sl.forEach(s=>{const b=sBrand(s);(bb[b]=bb[b]||{b,n:0,sold:0,cost:0}).n++;bb[b].sold+=s.price;bb[b].cost+=s.cost;(tp[s.name]=tp[s.name]||{name:s.name,n:0,l:0}).n++;tp[s.name].l+=s.price-s.cost});
  ex.forEach(x=>{ec[x.cat]=(ec[x.cat]||0)+x.v});
  return{from,to,n:sl.length,sold,cost,exp,profit:sold-cost-exp,rec,open,byBrand:Object.values(bb).sort((a,b)=>b.cost-a.cost),exByCat:Object.entries(ec).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v),top:Object.values(tp).sort((a,b)=>b.n-a.n||b.l-a.l).slice(0,5)}}

  return ch}

function calc(){const c=+$("cc").value||0,m=+$("cm").value||0;if(c<0||m<0||m>=100){$("cr").textContent="Informe custo não negativo e margem entre 0 e 99,99%.";return}const p=c/(1-m/100);$("cr").innerHTML=c?`Venda por <b>${money(p)}</b> → lucro de <b class="ok">${money(p-c)}</b> (margem real ${m}%)`:""}
const theme=t=>{document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("KM_theme",t)}catch(e){}};
try{const t=localStorage.getItem("KM_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
function downloadBk(){if(cloudOn&&!(ready.sales&&ready.products&&ready.expenses&&ready.config))return alert("Aguarde a sincronização para baixar o backup completo.");const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='KM-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function copyBk(){const j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(()=>alert("Backup copiado!"),()=>{$("bk").value=j;$("bk").select()})}catch(e){$("bk").value=j;$("bk").select()}}
function restore(){if(cloudOn)return alert('Restauração direta com nuvem conectada está bloqueada para evitar conflitos. Use um ambiente de teste ou restaure pelo console do Firebase.');try{const d=JSON.parse($("bk").value);const v=d.data&&d.version?d.data:d;if(!Array.isArray(v.sales)||!Array.isArray(v.products))throw 0;if(confirm("Substituir os dados atuais?")){if(!v.catalog)v.catalog=S.catalog||[];for(const k of["cphotos","expenses","closings","config","proofs","clients","history","recurring"])if(!v[k])v[k]=S[k]||[];S=v;save();render()}}catch(e){alert("Backup inválido")}}

function readImg(inp,cb,mx=260,ql=.55){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",ql))};im.src=r.result};r.readAsDataURL(f)}

let pEdit="",pSel={},FL=[],pCur="";
const pBrand=()=>CATS().find(x=>x.id===$("pb").value);
const pModels=b=>b?[...b.models].sort((x,y)=>(x.p||0)-(y.p||0)||x.n.localeCompare(y.n,"pt",{numeric:true})):[];
const pModel=()=>pModels(pBrand()).find(m=>m.n===$("pm").value);
const pFlavs=(b,m)=>{const seen=new Set(),L=[];[...(m?m.f:[]),...((b&&b.f)||[])].forEach(x=>{const k=norm(x);if(!seen.has(k)){seen.add(k);L.push(x)}});return L.sort((x,y)=>x.localeCompare(y,"pt"))};
function pVis(){const c=!!$("pb").value,e=!!pEdit;$("pcat").style.display=c?"block":"none";$("pnew").style.display=c&&!e?"block":"none";$("pedt").style.display=c&&e?"block":"none";$("pman").style.display=(!c||e)?"block":"none"}
function pbChange(u,keep){const b=pBrand();$("pm").innerHTML=pModels(b).map(m=>`<option value="${esc(m.n)}" ${keep===m.n?"selected":""}>${esc(m.n)}${m.p?" · "+m.p.toLocaleString("pt-BR")+" puffs":""}</option>`).join("");pmChange(u)}
function pmChange(u){pSel={};FL=pFlavs(pBrand(),pModel());
  if(pEdit){if(u&&!FL.some(x=>norm(x)===norm(pCur)))pCur="";pFlSel();if(u)pName()}else{$("pq").value="";renderFl()}
  pVis()}
function pFlSel(){$("pfe").innerHTML=`<option value="">(sem sabor)</option>`+[...FL,...(pCur&&!FL.some(x=>norm(x)===norm(pCur))?[pCur]:[])].map(f=>`<option value="${esc(f)}" ${norm(f)===norm(pCur)?"selected":""}>${esc(f)}</option>`).join("")}
function pName(){const b=pBrand(),m=pModel();if(!b||!m)return;$("pn").value=b.name+" "+m.n+(pCur?" – "+pCur:"")}
function renderFl(){const raw=$("pq").value.trim(),q=norm(raw),L=FL.map((f,i)=>[f,i]).filter(([f])=>!q||norm(f).includes(q)),n=Object.keys(pSel).length;
  $("pfl").innerHTML=`<div class="sub" style="margin:6px 0">${n} sabor${n===1?"":"es"} selecionado${n===1?"":"s"}</div>`+(L.length?L.map(([f,i])=>{const on=pSel[f]!==undefined;return`<div class="inst" style="gap:8px"><label style="display:flex;gap:8px;align-items:center;margin:0;flex:1"><input type="checkbox" style="width:auto" ${on?"checked":""} onchange="pTog(${i},this.checked)"><span>${esc(f)}</span></label>${on?`<input type="number" inputmode="numeric" min="0" value="${pSel[f]}" style="width:64px" oninput="pSel[FL[${i}]]=+this.value||0">`:""}</div>`}).join(""):`<div class="sub">Nenhum sabor${q?" com esse nome":" nesse modelo ainda"}.</div>`)
   +(q&&pModel()&&!FL.some(f=>norm(f)===q)?`<button class="g" style="margin-top:8px" onclick="pAddNew()">+ Adicionar “${esc(raw)}” ao catálogo</button>`:"")}
function pTog(i,c){const f=FL[i];if(c)pSel[f]=pSel[f]??1;else delete pSel[f];renderFl()}
function pAddNew(){const m=pModel(),f=$("pq").value.trim();if(!m||!f)return;if(!m.f.some(x=>norm(x)===norm(f)))m.f.push(f);save();FL=pFlavs(pBrand(),m);const nf=FL.find(x=>norm(x)===norm(f))||f;pSel[nf]=1;$("pq").value="";renderFl()}

function saveProd(id){
  const cost=+$("pc").value||0,price=+$("pp").value||0,b=pBrand();
  const minStock=+$('pmin').value,sku=$('psku').value.trim(),supplier=$('psupplier').value.trim();
  if(!Number.isInteger(minStock)||minStock<0)return alert('Estoque mínimo inválido.');
  if(!Number.isFinite(cost)||!Number.isFinite(price)||cost<0||price<0)return alert("Custos e preços devem ser válidos e não negativos.");
  if(!id&&!b&&(!Number.isInteger(+$('ps').value)||+$('ps').value<0))return alert("Estoque deve ser inteiro e não negativo.");
  if(b&&!id){
    const m=pModel();if(!m)return alert("Escolha o modelo");const ks=Object.keys(pSel);if(!ks.length)return alert("Marque pelo menos um sabor");
    let nw=0,up=0;
    ks.forEach(f=>{const name=b.name+" "+m.n+" – "+f,ex=S.products.find(x=>norm(x.name)===norm(name));
      if(ex){ex.stock=(+ex.stock||0)+(pSel[f]||0);if(!ex.brand){ex.brand=b.name;ex.model=m.n;ex.flavor=f}if(tmpImg&&!ex.img)ex.img=tmpImg;up++}
      else{S.products.push({id:uid(),name,brand:b.name,model:m.n,flavor:f,cost,price,stock:pSel[f]||0,img:tmpImg||cph(b.name,m.n,f),minStock,sku,supplier});nw++}});
    save();closeM();render();if(up)alert(nw+" pod(s) criado(s). "+up+" já existiam: só somei o estoque (custo e preço ficaram como estavam).");return}
  const o={name:$("pn").value.trim(),cost,price,stock:+$("ps").value||0,img:tmpImg,brand:"",model:"",flavor:"",sku,supplier,minStock,archived:id?$("parch").checked:false};
  if(b){const m=pModel();o.brand=b.name;o.model=m?m.n:"";o.flavor=pCur||""}
  if(!o.name)return alert("Informe o nome do produto");if(!Number.isInteger(o.stock)||o.stock<0)return alert("Estoque inválido: use um inteiro maior ou igual a zero.");
  if(id)Object.assign(S.products.find(x=>x.id===id),o);else S.products.push({id:uid(),...o});
  save();closeM();render();
}

 await db.runTransaction(async tx=>{const ref=db.collection('products').doc(id),snap=await tx.get(ref);if(!snap.exists)throw Error('Produto não existe mais.');const cur=+snap.data().stock||0;if(cur+delta<0)throw Error('Estoque insuficiente para esta saída.');tx.update(ref,{stock:cur+delta});tx.set(db.collection('history').doc(uid()),auditObj('Estoque',p.name+' • '+(delta>0?'+':'')+delta+' • '+reason,id))});
 closeM();render();}catch(e){alert('Não foi possível ajustar: '+e.message)}finally{syncBusy=false}return;
 }

const auditObj=(type,detail,ref='')=>({id:uid(),at:new Date().toISOString(),actor:userTag(),type,detail,ref});
async function performSale(oldSale,newSale,type='Venda'){
 if(syncBusy)return false;
 if(cloudOn&&db&&(!ready.sales||!ready.products||!ready.history)){alert('Aguarde a sincronização terminar antes de alterar vendas.');return false}
 if(cloudOn&&db){syncBusy=true;try{
  await db.runTransaction(async tx=>{
   const sid=(newSale||oldSale).id,ref=db.collection('sales').doc(sid),ss=await tx.get(ref),remote=ss.exists?ss.data():null;
   if(oldSale&&!remote)throw Error('A venda não existe mais. Atualize o sistema.');
   if(!oldSale&&remote)throw Error('Venda duplicada. Atualize o sistema.');
   if(oldSale&&remote&&(+remote.rev||0)!==(+oldSale.rev||0))throw Error('Venda alterada por outro usuário. Atualize antes de editar.');
   const a=remote?.pid||'',b=newSale?.pid||'';
   const refs=new Map();if(a!==b){for(const pid of [a,b])if(pid&&!refs.has(pid))refs.set(pid,db.collection('products').doc(pid))}
   const snaps=new Map();for(const [id,pref] of refs)snaps.set(id,await tx.get(pref));
   if(a!==b){if(a&&snaps.get(a)?.exists){const cur=+snaps.get(a).data().stock||0;tx.update(refs.get(a),{stock:cur+1})}
    if(b){const sp=snaps.get(b);if(!sp?.exists)throw Error('Produto escolhido foi excluído do estoque.');const cur=+sp.data().stock||0;if(cur<1)throw Error('Sem unidades disponíveis.');tx.update(refs.get(b),{stock:cur-1})}}
   if(newSale)tx.set(ref,{...newSale,rev:(+remote?.rev||0)+1});else tx.delete(ref);
   tx.set(db.collection('history').doc(uid()),auditObj(type,((newSale||oldSale).name||'')+' • '+((newSale||oldSale).client||'sem cliente')+' • '+money((newSale||oldSale).price),sid));
  });
  if(newSale){const i=S.sales.findIndex(x=>x.id===newSale.id);if(i>=0)S.sales[i]={...newSale,rev:(oldSale?.rev||0)+1};else S.sales.push({...newSale,rev:1});}
  else S.sales=S.sales.filter(x=>x.id!==oldSale.id);
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  return true;
 }catch(e){alert('Operação não salva: '+e.message);return false}finally{syncBusy=false}}
 const prev=oldSale?.pid||'',next=newSale?.pid||'';
 if(prev!==next){const before=S.products.find(p=>p.id===prev),after=S.products.find(p=>p.id===next);
  if(after&&(+after.stock||0)<1){alert('Sem estoque.');return false}if(before)before.stock=(+before.stock||0)+1;if(after)after.stock=(+after.stock||0)-1;}
 if(newSale){const i=S.sales.findIndex(x=>x.id===newSale.id);if(i>=0)S.sales[i]={...newSale,rev:(oldSale?.rev||0)+1};else S.sales.push({...newSale,rev:1})}
 else S.sales=S.sales.filter(x=>x.id!==oldSale.id);
 logEvent(type,((newSale||oldSale).name||'')+' • '+((newSale||oldSale).client||'')+' • '+money((newSale||oldSale).price),((newSale||oldSale).id));save();return true;
}

 if(!name||!Number.isFinite(price)||price<=0||!Number.isFinite(cost)||cost<0)return alert('Confira produto, preço e custo.');
 if(ph&&ph.length<10)return alert('WhatsApp precisa incluir DDD.');
 const pv_=$('sp').value,pid=pv_.startsWith('c:')?'':pv_,inst=curPlan();
 if(pv_.startsWith('c:'))return alert('Cadastre esse sabor no estoque antes de vender.');
 if(!pid&&!editId&&!confirm('Venda sem produto vinculado: o estoque NÃO será reduzido. Deseja registrar mesmo assim?'))return;
 if(!Array.isArray(inst)||inst.length<1||inst.some(i=>!Number.isFinite(i.v)||i.v<0||!/\d{4}-\d{2}-\d{2}/.test(i.d)))return alert('Parcelas inválidas.');
 const total=Math.round(inst.reduce((a,x)=>a+x.v,0)*100)/100;
 if(Math.abs(total-price)>.009)return alert('A soma das parcelas precisa ser igual ao preço da venda.');
 const old=editId?S.sales.find(x=>x.id===editId):null;
 if(editId&&!old)return alert('Venda não encontrada.');
 if(old&&redo()&&old.inst.some(i=>i.paid)&&!confirm('Refazer parcelas remove pagamentos e comprovantes. Continuar?'))return;
 const sellerName=$('sseller').value.trim();if(!sellerName)return alert('Informe o responsável pela venda.');
 const sellerMatch=findSeller(sellerName),sellerId=(old&&norm(old.sellerName||'')===norm(sellerName)?old.sellerId||'':sellerMatch?.uid||''),sellerEmail=(old&&norm(old.sellerName||'')===norm(sellerName)?old.sellerEmail||'':sellerMatch?.email||'');
 const obj={id:old?.id||uid(),pid,name,img:tmpImg,cost,price,client:$('sl').value.trim(),phone:ph,note:$('so').value.trim(),date:old?($('sdt').value||old.date):today(),inst,statusOrder:$('sorder').value,deliveryMethod:$('smethod').value,tracking:$('stracking').value.trim(),paymentMethod:$('spayment').value,sellerName,sellerId,sellerEmail,createdAt:old?.createdAt||new Date().toISOString(),createdBy:old?.createdBy||userTag(),modifiedAt:new Date().toISOString(),modifiedBy:userTag()};
 const done=await performSale(old,obj,old?'Venda editada':'Venda criada');if(!done)return;
 if(old&&redo()){S.proofs=S.proofs.filter(x=>!x.id.startsWith(old.id+'_'));save()}

 closeM();tab='sales';render();

async function saveProd(id){const cost=+$('pc').value,price=+$('pp').value,b=pBrand(),minStock=+$('pmin').value,sku=$('psku').value.trim(),supplier=$('psupplier').value.trim();
 if(!Number.isFinite(cost)||!Number.isFinite(price)||cost<0||price<0)return alert('Custo e preço devem ser não negativos.');
 if(!Number.isInteger(minStock)||minStock<0)return alert('Estoque mínimo inválido.');
 const list=[];

   for(let j=0;j<list.length;j++){const x=list[j],cur=docs[j].data();if(x.old){if(!docs[j].exists)throw Error('Produto alterado ou removido. Atualize.');

function sellersReport(rows=S.sales){

 rows.forEach(s=>{const key=s.sellerId||'name:'+norm(s.sellerName||'Sem responsável (anterior)');
  if(!m.has(key))m.set(key,{id:key,name:s.sellerName||'Sem responsável (anterior)',count:0,sold:0,cost:0,received:0,open:0,margin:0});

 });return [...m.values()].sort((a,b)=>b.sold-a.sold);

// --- Fechamento diário: snapshot para conferência e auditoria ---
function dayPayments(date){return allInst().filter(({i})=>i.paid&&(i.pd||i.d)===date)}
function dailySummary(d){
 const sales=S.sales.filter(s=>s.date===d),receipts=dayPayments(d),expenses=S.expenses.filter(x=>x.date===d);
 const gross=sumBy(sales,s=>Number(s.price)||0),cost=sumBy(sales,s=>Number(s.cost)||0);
 const received=sumBy(receipts,({i})=>Number(i.v)||0),spent=sumBy(expenses,x=>Number(x.v)||0);
 const methods={};receipts.forEach(({s,i})=>{const m=i.method||s.paymentMethod||'Não informado';methods[m]=(methods[m]||0)+(+i.v||0)});
 return {date:d,orders:sales.length,gross,cost,grossMargin:gross-cost,received,spent,cashMovement:received-spent,methods,receipts:receipts.length,expenseCount:expenses.length,
  missingPaymentDate:receipts.filter(({i})=>!i.pd).length};
}
function closingId(d){return 'cashclose-'+d}

 if(!closingDate)closingDate=today();const d=closingDate,day=dailySummary(d),cl=closingFor(d);
 const discrepancy=cl?cashNum(day.received-(cl.received||0)):0;
 const changed=cl&&['orders','gross','cost','received','spent'].some(k=>Math.abs((+day[k]||0)-(+cl[k]||0))>.009);
 return `<h1>🧮 Fechamento diário</h1>
 <div class="twoCols"><div><label>Data da conferência</label><input type="date" max="${today()}" value="${d}" onchange="closingDate=this.value;render()"></div><div><label>Situação</label><div class="metric"><b class="${cl?'ok':'warn'}">${cl?'Fechado':'Em aberto'}</b></div></div></div>
 <div class="grid" style="margin-top:12px">
  <div class="metric"><div class="label">Vendas (${day.orders})</div><div class="number">${money(day.gross)}</div></div>
  <div class="metric"><div class="label">Custo das vendas</div><div class="number">${money(day.cost)}</div></div>
  <div class="metric"><div class="label">Margem bruta</div><div class="number ${day.grossMargin<0?'bad':'ok'}">${money(day.grossMargin)}</div></div>
  <div class="metric"><div class="label">Recebimentos (${day.receipts})</div><div class="number ok">${money(day.received)}</div></div>
  <div class="metric"><div class="label">Despesas lançadas (${day.expenseCount})</div><div class="number bad">${money(day.spent)}</div></div>
  <div class="metric"><div class="label">Movimento líquido registrado</div><div class="number">${money(day.cashMovement)}</div></div>
 </div>
 <div class="opsnote">O caixa utiliza pagamentos pela <b>data de recebimento</b> e despesas pela <b>data de lançamento</b>. O custo das vendas é mostrado à parte e não descontado de novo do dinheiro recebido. ${day.missingPaymentDate?'Atenção: '+day.missingPaymentDate+' pagamento(s) antigo(s) sem data registrada foram atribuídos ao vencimento.':''}</div>
 <h2>Recebido por meio de pagamento</h2><div class="card">${Object.entries(day.methods).sort((a,b)=>b[1]-a[1]).map(([name,value])=>`<div class="opslist"><span>${esc(name)}</span><b>${money(value)}</b></div>`).join('')||'<div class="sub">Sem pagamentos registrados nesta data.</div>'}</div>

function forecastOpen(days){const now=today(),end=addDays(now,days);
 const due=allInst().filter(({i})=>!i.paid&&i.d>now&&i.d<=end);
 const recurringDue=[];
 for(const r of (S.recurring||[])){
  if(!(Number(r.value)>0))continue;
  for(let m=0;m<3;m++){
   const ref=new Date(now+'T12:00:00');ref.setDate(1);ref.setMonth(ref.getMonth()+m);
   const year=ref.getFullYear(),month=String(ref.getMonth()+1).padStart(2,'0'),ym=year+'-'+month;
   const day=String(Math.min(+r.day||1,dim(year,ref.getMonth()+1))).padStart(2,'0'),date=ym+'-'+day;
   if(date<=now||date>end)continue;
   if(S.expenses.some(x=>x.recurringId===r.id&&(x.month===ym||String(x.date||'').slice(0,7)===ym)))continue;
   recurringDue.push({r,date,v:+r.value});
  }
 }
 const incoming=sumBy(due,({i})=>+i.v||0),fixed=sumBy(recurringDue,x=>x.v);
 return {due,recurringDue,incoming,fixed,net:cashNum(incoming*forecastRate/100-fixed),end};
}

 document.body.appendChild(overlay);document.getElementById('km3cancel').onclick=()=>overlay.remove();

 if(section==='avaliacoes'&&(!Number.isInteger(payload.nota)||payload.nota<1||payload.nota>5)){document.getElementById('km3editmsg').textContent='Nota deve ser de 1 a 5';return}
 button.disabled=true;document.getElementById('km3editmsg').textContent='Salvando...';
 const {data,error}=await sb.from(table[section]).update(payload).eq('id',row.id).select('id');
 if(error||!data?.length){document.getElementById('km3editmsg').textContent='Não foi possível salvar: '+(error?.message||'Sem permissão para editar este registro');button.disabled=false;return}
 overlay.remove();load();
 };
