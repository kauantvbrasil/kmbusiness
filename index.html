<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Vendas</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vendas">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#edf2f8;--card:#ffffff;--tx:#101827;--mu:#61728b;--bd:#dce5f1;--pri:#1262e4;--ok:#12a150;--bad:#e5484d;--warn:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d16;--card:#121b2a;--tx:#eef4ff;--mu:#99abc5;--bd:#263751;--pri:#287df4;--ok:#3ccf85;--bad:#ff6b6f;--warn:#f0b13a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080d16;--card:#121b2a;--tx:#eef4ff;--mu:#99abc5;--bd:#263751;--pri:#287df4;--ok:#3ccf85;--bad:#ff6b6f;--warn:#f0b13a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;letter-spacing:-.03em}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:0 3px 14px rgba(0,20,55,.045)}
.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:700;margin-top:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.item{margin-bottom:8px}.sub{font-size:12.5px;color:var(--mu)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--bd);color:var(--tx)}button.r{background:transparent;color:var(--bad);padding:4px 8px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--bd)}
.chip.bad{background:var(--bad);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px;border-radius:8px}
nav button b{display:block;font-size:19px}nav button.on{color:var(--pri);background:rgba(42,125,244,.09)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.inst{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:13.5px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Nova venda">+</button>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="login"></div>
<script>
const KEY="agenda_vendas_v1";
let S={products:[],sales:[]},tab="home",filter="";
let stockSort="default",catalogSort="default"; // Preferências apenas visuais, nunca sincronizadas
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
for(const k of["expenses","closings","config","proofs","catalog","cphotos"])if(!Array.isArray(S[k]))S[k]=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSave()};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date());
const fmt=s=>s.split("-").reverse().slice(0,2).join("/");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const addDate=(s,i,mode)=>{const d=new Date(s+"T12:00:00");if(mode==="w")d.setDate(d.getDate()+7*i);else if(mode==="q")d.setDate(d.getDate()+15*i);else{const dd=d.getDate();d.setMonth(d.getMonth()+i);if(d.getDate()!==dd)d.setDate(0)}return iso(d)};
const paid=s=>s.inst.filter(i=>i.paid).reduce((a,i)=>a+i.v,0);
const status=i=>i.paid?"ok":i.d<today()?"bad":i.d===today()?"warn":"";

function stats(){
  let sold=0,cost=0,rec=0,open=0,late=0;
  S.sales.forEach(s=>{sold+=s.price;cost+=s.cost;const p=paid(s);rec+=p;open+=s.price-p;s.inst.forEach(i=>{if(!i.paid&&i.d<today())late+=i.v})});
  return{sold,cost,rec,open,late,profit:sold-cost,real:rec-cost};
}
function allInst(){const a=[];S.sales.forEach(s=>s.inst.forEach((i,n)=>a.push({s,i,n})));return a}

function render(){
  $("nav").innerHTML=[["home","📊","Início"],["cobr","🗓️","Cobranças"],["sales","🧾","Vendas"],["prod","📦","Pods"],["more","⚙️","Mais"]]
   .map(([k,e,t])=>`<button class="${tab===k||(k==="more"&&tab==="km")?"on":""}" onclick="go('${k}')"><b>${e}</b>${t}</button>`).join("");
  $("fab").style.display=(tab==="prod"||tab==="more"||tab==="km")?"none":"block";
  if(tryClose())save();
  $("app").innerHTML={home,cobr,sales,prod,more,km}[tab]();
}
const go=t=>{tab=t;render();scrollTo(0,0)};

function home(){
  const t=stats(),all=allInst().filter(x=>!x.i.paid).sort((a,b)=>a.i.d.localeCompare(b.i.d));
  const hoje=all.filter(x=>x.i.d===today()),atr=all.filter(x=>x.i.d<today());
  const m=today().slice(0,7);
  const mesRec=allInst().filter(x=>x.i.paid&&(x.i.pd||x.i.d).slice(0,7)===m).reduce((a,x)=>a+x.i.v,0);
  const mesVend=S.sales.filter(s=>s.date.slice(0,7)===m).length;
  const top={};S.sales.forEach(s=>{top[s.name]=(top[s.name]||0)+1});
  const best=Object.entries(top).sort((a,b)=>b[1]-a[1])[0];
  const low=S.products.filter(p=>(+p.stock||0)<=1).sort((a,b)=>(a.stock-b.stock)||byName(a,b));
  const gr={};S.sales.forEach(s=>{const p=S.products.find(x=>x.id===s.pid),k=rk==="mod"&&p&&p.brand&&p.model?p.brand+" "+p.model:s.name;(gr[k]=gr[k]||{n:0,l:0}).n++;gr[k].l+=s.price-s.cost});
  const rank=Object.entries(gr).sort((a,b)=>b[1].n-a[1].n||b[1].l-a[1].l).slice(0,6);
  return`<h1>Minhas vendas</h1>
  <div class="grid">
   <div class="card"><div class="k">Total vendido</div><div class="v">${money(t.sold)}</div></div>
   <div class="card"><div class="k">Quanto paguei (custo)</div><div class="v">${money(t.cost)}</div></div>
   <div class="card"><div class="k">Lucro previsto</div><div class="v ${t.profit>=0?"ok":"bad"}">${money(t.profit)}</div></div>
   <div class="card"><div class="k">Lucro real (recebido − custo)</div><div class="v ${t.real>=0?"ok":"bad"}">${money(t.real)}</div></div>
   <div class="card"><div class="k">Já recebi</div><div class="v ok">${money(t.rec)}</div></div>
   <div class="card"><div class="k">A receber</div><div class="v warn">${money(t.open)}</div></div>
  </div>
  ${t.late>0?`<div class="card item" style="margin-top:10px;border-color:var(--bad)"><b class="bad">⚠️ ${money(t.late)} em atraso</b><div class="sub">${atr.length} parcela(s) vencida(s)</div></div>`:""}
  ${kmCard()}
  <h2>Hoje (${hoje.length})</h2>${hoje.length?hoje.map(instRow).join(""):`<div class="empty">Nada vence hoje 🎉</div>`}
  <h2>Atrasadas (${atr.length})</h2>${atr.length?atr.slice(0,5).map(instRow).join(""):`<div class="empty">Nenhuma atrasada</div>`}
  ${S.products.length?`<h2>Estoque baixo (${low.length})</h2>${low.length?low.slice(0,8).map(p=>`<div class="card item"><div class="row"><b class="grow">${esc(p.name)}</b><b class="${p.stock<=0?"bad":"warn"}">${p.stock<=0?"Sem estoque":"Resta "+p.stock}</b></div></div>`).join("")+(low.length>8?`<div class="sub">+ ${low.length-8} na aba Pods</div>`:""):`<div class="empty">Estoque em dia 👍</div>`}`:""}
  <h2>Mais vendidos</h2><div class="row" style="margin-bottom:8px"><button class="${rk==="pod"?"":"g"}" onclick="rk='pod';render()">Por sabor</button><button class="${rk==="mod"?"":"g"}" onclick="rk='mod';render()">Por modelo</button></div>
  ${rank.length?rank.map(([k,v])=>`<div class="card item"><div class="row"><b class="grow">${esc(k)}</b><span class="sub">${v.n} venda${v.n>1?"s":""} · lucro <b class="${v.l>=0?"ok":"bad"}">${money(v.l)}</b></span></div></div>`).join(""):`<div class="empty">Ainda sem vendas.</div>`}
  <h2>Este mês</h2><div class="card"><div class="sub">Vendas feitas: <b>${mesVend}</b> · Recebido: <b class="ok">${money(mesRec)}</b>${best?` · Mais vendido: <b>${esc(best[0])}</b> (${best[1]})`:""}</div></div>`;
}
function instRow(x){
  const {s,i,n}=x,st=status(i),dias=Math.round((new Date(i.d)-new Date(today()))/864e5);
  const lbl=i.paid?"Pago":st==="bad"?`${-dias}d atraso`:st==="warn"?"Hoje":`em ${dias}d`;
  const msg=encodeURIComponent(`Oi ${s.client}! Passando para lembrar da parcela ${n+1}/${s.inst.length} (${money(i.v)}) do ${s.name}, vencimento ${fmt(i.d)}. Obrigado!`);
  const ph=(s.phone||"").replace(/\D/g,"");
  return`<div class="card item"><div class="row">${thumb(s)}<div class="grow"><b>${esc(s.client||"Sem nome")}</b> <span class="chip ${st}">${lbl}</span>
  <div class="sub">${esc(s.name)} · parcela ${n+1}/${s.inst.length} · ${fmt(i.d)}</div><div><b>${money(i.v)}</b></div></div>
  <div style="display:grid;gap:6px">${i.paid?"":`<button onclick="pay('${s.id}',${n})">✓ Pago</button>`}${ph&&!i.paid?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/55${ph}?text=${msg}">💬 Cobrar</a>`:""}${i.paid?"":`<a class="btn g" target="_blank" rel="noopener" href="${gcal(s,i,n)}">📅 Agenda</a>`}${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾 Ver":"＋ 🧾"}</button>`:""}</div></div></div>`;
}
const gcal=(s,i,n)=>{const d=new Date(i.d+"T12:00:00");d.setDate(d.getDate()+1);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("💰 Receber "+money(i.v)+" - "+(s.client||"cliente"))+"&dates="+i.d.replace(/-/g,"")+"/"+iso(d).replace(/-/g,"")+"&details="+encodeURIComponent(s.name+" · parcela "+(n+1)+"/"+s.inst.length)};
const thumb=s=>s.img?`<img class="thumb" src="${s.img}" alt="">`:`<div class="thumb">💨</div>`;

function cobr(){
  const f=filter,list=allInst().filter(x=>f==="paid"?x.i.paid:f==="late"?(!x.i.paid&&x.i.d<today()):!x.i.paid).sort((a,b)=>a.i.d.localeCompare(b.i.d));
  return`<h1>Cobranças</h1><div class="row" style="margin-bottom:10px">
  ${[["","A receber"],["late","Atrasadas"],["paid","Pagas"]].map(([k,t])=>`<button class="${f===k?"":"g"}" onclick="filter='${k}';render()">${t}</button>`).join("")}</div>
  ${list.length?list.map(instRow).join(""):`<div class="empty">Nada por aqui</div>`}`;
}
let tmpProof="";
const getProof=(id,n)=>((S.proofs.find(x=>x.id===id+"_"+n))||{}).img||"";
function setProof(id,n,img){const k=id+"_"+n,j=S.proofs.findIndex(x=>x.id===k);if(!img){if(j>=0)S.proofs.splice(j,1)}else if(j>=0)S.proofs[j].img=img;else S.proofs.push({id:k,img})}
function pay(id,n){const s=S.sales.find(x=>x.id===id),i=s.inst[n];
  if(i.paid){i.paid=false;i.pd=null;save();render();return}
  tmpProof="";modal(`<h1>Marcar como pago</h1><div class="sub">${esc(s.client||"Sem nome")} · ${esc(s.name)} · parcela ${n+1}/${s.inst.length} · <b>${money(i.v)}</b></div>
  <label>Comprovante (foto, opcional)</label><div class="row"><img id="prv" class="thumb" style="width:72px;height:72px"><div class="grow"><input type="file" accept="image/*" onchange="readImg(this,d=>{tmpProof=d;prv.src=d},1000,.6)"></div></div>
  <div class="row" style="margin-top:14px"><button onclick="confirmPay('${id}',${n})">✓ Confirmar pagamento</button><button class="g" onclick="closeM()">Cancelar</button></div>`)}
function confirmPay(id,n){const i=S.sales.find(x=>x.id===id).inst[n];i.paid=true;i.pd=today();if(tmpProof)setProof(id,n,tmpProof);save();closeM();render()}
function proofForm(id,n){const im=getProof(id,n);modal(`<h1>🧾 Comprovante</h1>${im?`<img src="${im}" style="width:100%;border-radius:12px;margin:8px 0">`:`<div class="empty">Sem comprovante ainda.</div>`}
  <label>${im?"Trocar foto":"Adicionar foto"}</label><input type="file" accept="image/*" onchange="readImg(this,d=>{setProof('${id}',${n},d);save();closeM();render()},1000,.6)">
  <div class="row" style="margin-top:12px">${im?`<button class="r" onclick="setProof('${id}',${n},'');save();closeM();render()">Remover</button>`:""}<button class="g" onclick="closeM()">Fechar</button></div>`)}

function sales(){
  const q=(filter||"").toLowerCase();
  const list=[...S.sales].filter(s=>!q||(s.client+s.name).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
  return`<h1>Vendas</h1><input placeholder="🔍 Buscar cliente ou pod" value="${esc(filter)}" oninput="filter=this.value;render();document.querySelector('input').focus()">
  <div style="height:10px"></div>${list.length?list.map(s=>{
   const p=paid(s),pct=Math.min(100,p/s.price*100);
   return`<details class="card item"><summary style="list-style:none;cursor:pointer"><div class="row">${thumb(s)}<div class="grow"><b>${esc(s.name)}</b>
   <div class="sub">${esc(s.client||"Sem nome")} · ${fmt(s.date)}</div>
   <div class="sub">Venda ${money(s.price)} · Custo ${money(s.cost)} · Lucro <b class="${s.price-s.cost>=0?"ok":"bad"}">${money(s.price-s.cost)}</b></div></div></div>
   <div class="bar"><i style="width:${pct}%"></i></div><div class="sub">Recebido ${money(p)} de ${money(s.price)}</div></summary>
   ${s.inst.map((i,n)=>`<div class="inst"><span>${n+1}ª · ${fmt(i.d)} · ${money(i.v)} <span class="chip ${status(i)}">${i.paid?"pago":status(i)==="bad"?"atrasada":"aberta"}</span></span><span class="row" style="gap:6px">${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾":"＋🧾"}</button>`:""}<button class="${i.paid?"g":""}" onclick="pay('${s.id}',${n})">${i.paid?"Desfazer":"Pago"}</button></span></div>`).join("")}
   ${s.note?`<div class="sub" style="margin-top:6px">📝 ${esc(s.note)}</div>`:""}
   <div class="row" style="justify-content:flex-end;flex-wrap:wrap;margin-top:8px"><button onclick="printReceipt('${s.id}')">🧾 Recibo</button><button class="g" onclick="saleForm('${s.id}')">✏️ Editar venda</button><button class="r" onclick="delSale('${s.id}')">Excluir venda</button></div></details>`}).join(""):`<div class="empty">Nenhuma venda ainda. Toque no + para registrar.</div>`}`;
}
// Recibo gerado a partir da venda existente; não altera dados nem sincronização.
function printReceipt(id){
  const s=S.sales.find(x=>x.id===id);if(!s)return alert("Venda não encontrada.");
  const amount=paid(s),pending=Math.max(0,s.price-amount),full=amount>=s.price-0.009;
  const lines=(s.inst||[]).map((i,n)=>`<tr><td>${n+1}ª · ${esc(fmt(i.d))}</td><td>${money(i.v)}</td><td>${i.paid?"Pago":"Pendente"}</td></tr>`).join("");
  const safe=(v)=>esc(v||"Não informado");
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recibo K&M · ${esc(s.id)}</title><style>
  *{box-sizing:border-box}body{margin:0;background:#eaf0f8;color:#111927;font:14px/1.5 Arial,sans-serif}.paper{max-width:620px;margin:24px auto;background:white;padding:36px;border-radius:14px;box-shadow:0 8px 35px #07172b17}.head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #1262e4;padding-bottom:18px}.brand{font-weight:900;font-size:25px;letter-spacing:-1px;color:#101a2b}.brand span{color:#1262e4}.muted{color:#66758c;font-size:12px}h1{font-size:19px;margin:24px 0 15px}section{padding:14px 0;border-bottom:1px solid #e3e9f2}.r{display:flex;justify-content:space-between;gap:15px;margin:5px 0}.r strong{text-align:right}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px 7px;text-align:left;border-bottom:1px solid #e3e9f2}th{color:#64758b;font-size:12px}.total{font-size:18px;font-weight:bold;color:#1262e4}.tag{font-weight:bold;color:${full?"#137744":"#a66a00"}}.small{font-size:11px;color:#7a8597;margin-top:22px}.actions{text-align:center;margin:15px}.actions button{padding:12px 20px;background:#1262e4;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}@media print{body{background:white}.paper{margin:0;max-width:none;padding:10mm;box-shadow:none;border-radius:0}.actions{display:none}}@media(max-width:600px){.paper{margin:8px;padding:20px}}
  </style></head><body><div class="actions"><button onclick="window.print()">Imprimir / Salvar em PDF</button></div><div class="paper"><div class="head"><div class="brand">K<span>&</span>M <span>IMPORTS</span></div><div class="muted">RECIBO DE VENDA</div></div><h1>Comprovante de negociação</h1><section><div class="r"><span>Nº da venda</span><strong>${safe(s.id)}</strong></div><div class="r"><span>Data da venda</span><strong>${esc(fmt(s.date))}</strong></div><div class="r"><span>Cliente</span><strong>${safe(s.client)}</strong></div><div class="r"><span>Contato</span><strong>${safe(s.phone)}</strong></div></section><section><div class="r"><span>Produto</span><strong>${safe(s.name)}</strong></div><div class="r"><span>Valor total</span><strong>${money(s.price)}</strong></div></section><section><b>Parcelas e pagamentos</b><table><thead><tr><th>Parcela / vencimento</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${lines}</tbody></table></section><section><div class="r"><span>Valor recebido</span><strong>${money(amount)}</strong></div><div class="r"><span>Saldo em aberto</span><strong>${money(pending)}</strong></div><div class="r total"><span>Status</span><span class="tag">${full?"QUITADO":"PAGAMENTO PENDENTE"}</span></div></section>${s.note?`<section><b>Observações</b><div>${esc(s.note)}</div></section>`:""}<p class="small">Documento gerado a partir do registro interno da venda. Não é nota fiscal e não comprova o pagamento de parcelas marcadas como pendentes.</p></div></body></html>`;
  const w=window.open("","_blank");if(!w){alert("Autorize janelas pop-up para gerar o recibo.");return}w.document.open();w.document.write(html);w.document.close();
}

function delSale(id){if(confirm("Excluir esta venda?")){S.sales=S.sales.filter(s=>s.id!==id);S.proofs=S.proofs.filter(x=>!x.id.startsWith(id+"_"));save();render()}}

const PROOF_FROM="2026-11-04",EXC=["Frete / entrega","Embalagem","Anúncios / marketing","Taxas (Pix, maquininha)","Equipamento","Outros"];
const pad=n=>String(n).padStart(2,"0"),dim=(y,m)=>new Date(y,m,0).getDate(),c30=(y,m)=>Math.min(30,dim(y,m));
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)};
const cyStart=d=>{const[y,m,dd]=d.split("-").map(Number);if(dd>=c30(y,m))return y+"-"+pad(m)+"-"+pad(c30(y,m));let py=y,pm=m-1;if(pm<1){pm=12;py--}return py+"-"+pad(pm)+"-"+pad(c30(py,pm))};
const nextStart=st=>{let[y,m]=st.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+pad(m)+"-"+pad(c30(y,m))};
const cyEnd=st=>addDays(nextStart(st),-1),prevStart=st=>cyStart(addDays(st,-1));

function cyCalc(from,to){
  const sl=S.sales.filter(s=>s.date>=from&&s.date<=to),ex=S.expenses.filter(x=>x.date>=from&&x.date<=to);
  const sold=sumBy(sl,s=>s.price),cost=sumBy(sl,s=>s.cost),exp=sumBy(ex,x=>x.v);let rec=0;
  allInst().forEach(({i})=>{if(i.paid){const d=i.pd||i.d;if(d>=from&&d<=to)rec+=i.v}});
  const open=sumBy(sl,s=>sumBy(s.inst.filter(i=>!i.paid),i=>i.v)),bb={},ec={},tp={};
  sl.forEach(s=>{const b=sBrand(s);(bb[b]=bb[b]||{b,n:0,sold:0,cost:0}).n++;bb[b].sold+=s.price;bb[b].cost+=s.cost;(tp[s.name]=tp[s.name]||{name:s.name,n:0,l:0}).n++;tp[s.name].l+=s.price-s.cost});
  ex.forEach(x=>{ec[x.cat]=(ec[x.cat]||0)+x.v});
  return{from,to,n:sl.length,sold,cost,exp,profit:sold-cost-exp,rec,open,byBrand:Object.values(bb).sort((a,b)=>b.cost-a.cost),exByCat:Object.entries(ec).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v),top:Object.values(tp).sort((a,b)=>b.n-a.n||b.l-a.l).slice(0,5)}}
function tryClose(){
  if(cloudOn&&!["sales","expenses","closings"].every(c=>ready[c]))return false;
  const ds=[...S.sales.map(x=>x.date),...S.expenses.map(x=>x.date)].filter(Boolean).sort();if(!ds.length)return false;
  const cur=cyStart(today());let st=cyStart(ds[0]),ch=false;
  while(st<cur){if(!S.closings.some(c=>c.id===st)){const m=metas();S.closings.push({id:st,...cyCalc(st,cyEnd(st)),metas:{lucro:m.lucro||0,vendas:m.vendas||0}});ch=true}st=nextStart(st)}
  return ch}

    <div id="keep">${e.inst.map((i,n)=>`<div class="inst" style="gap:6px"><span>${n+1}ª</span><input type="date" id="id${n}" value="${i.d}" style="width:auto;flex:1;min-width:0" oninput="prev()"><input type="number" inputmode="decimal" id="iv${n}" value="${i.v}" style="width:84px" oninput="prev()"><label style="display:flex;gap:4px;align-items:center;margin:0;white-space:nowrap"><input type="checkbox" id="ip${n}" ${i.paid?"checked":""} style="width:auto" onchange="prev()">pago</label></div>`).join("")}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="rf" style="width:auto" onchange="toggleRf()">Refazer todas as parcelas do zero</label></div>`:""}
  <div id="redo" style="${e?"display:none":""}">
  <div class="grid"><div><label>Nº de parcelas</label><input id="sq" type="number" inputmode="numeric" value="${e?e.inst.length:1}" min="1" max="36" oninput="prev()"></div>
  <div><label>1º vencimento</label><input id="sd" type="date" value="${firstOpen?firstOpen.d:today()}" onchange="prev()"></div></div>
  <label>Intervalo</label><select id="si" onchange="prev()"><option value="m">Mensal</option><option value="q">Quinzenal</option><option value="w">Semanal</option></select>
  <label>Já entrou pago? (entrada, R$)</label><input id="se" type="number" inputmode="decimal" value="0" oninput="prev()"></div>
  <label>Observação</label><input id="so" value="${esc(v.note)}">
  <div id="pr" class="card" style="margin-top:10px"></div>
  <div class="row" style="margin-top:14px"><button onclick="saveSale()">${e?"Salvar alterações":"Salvar venda"}</button><button class="g" onclick="closeM()">Cancelar</button></div>`);{const pr=e&&S.products.find(x=>x.id===e.pid);if(pr)$("sb").value=pbKey(pr);sbChg();if(pr)$("sm").value=pr.model||"";spFill(e?e.pid:"")}prev();
}
const CPH=()=>S.cphotos||(S.cphotos=[]);
const phM=(b,m,f)=>"m-"+slug(b+" "+m+" "+f),phB=(b,f)=>"b-"+slug(b+" "+f);
const cph=(b,m,f)=>{if(!b||!f)return"";const x=CPH().find(y=>y.id===phM(b,m,f))||CPH().find(y=>y.id===phB(b,f));return x?x.img:""};
function setPh(id,img){const L=CPH(),i=L.findIndex(x=>x.id===id);if(!img){if(i>=0)L.splice(i,1)}else if(i>=0)L[i].img=img;else L.push({id,img})}
const saleBrands=()=>{const m=new Map();CATS().forEach(b=>m.set(b.name,b.name));S.products.forEach(p=>m.set(pbKey(p),p.brand||"Sem marca"));return[...m].sort((a,b)=>a[0]==="~"?1:b[0]==="~"?-1:a[1].localeCompare(b[1],"pt"))};
function sbChg(){const b=$("sb").value,mm=new Map(),cbr=CATS().find(x=>x.name===b);
  if(cbr)cbr.models.forEach(m=>mm.set(m.n,m.p||0));
  S.products.filter(p=>!b||pbKey(p)===b).forEach(p=>{if(p.model&&!mm.has(p.model))mm.set(p.model,puf(p))});
  const ms=[...mm].sort((x,y)=>x[1]-y[1]||x[0].localeCompare(y[0],"pt",{numeric:true}));
  $("sm").innerHTML=`<option value="">Todos os modelos</option>`+ms.map(([n,pf])=>`<option value="${esc(n)}">${esc(n)}${pf?" · "+pf.toLocaleString("pt-BR")+" puffs":""}</option>`).join("");spFill()}
function spFill(sel){sel=sel===undefined?$("sp").value:sel;const b=$("sb").value,m=$("sm").value,cbr=CATS().find(x=>x.name===b),cmd=cbr&&cbr.models.find(x=>x.n===m);
  const have=new Set(S.products.map(p=>norm(p.name)));
  const O=S.products.filter(p=>p.id===sel||((!b||pbKey(p)===b)&&(!m||p.model===m))).map(p=>({v:p.id,t:(b&&m&&p.flavor?p.flavor:p.name)+" (est. "+p.stock+")",k:b&&m&&p.flavor?p.flavor:p.name}));
  if(cbr&&cmd)pFlavs(cbr,cmd).filter(f=>!have.has(norm(cbr.name+" "+cmd.n+" – "+f))).forEach(f=>O.push({v:"c:"+f,t:f,k:f}));
  O.sort((x,y)=>x.k.localeCompare(y.k,"pt"));
  $("sp").innerHTML=`<option value="">— Outro (digitar abaixo) —</option>`+O.map(o=>`<option value="${esc(o.v)}" ${o.v===sel?"selected":""}>${esc(o.t)}</option>`).join("")}
function readKeep(){const o=S.sales.find(x=>x.id===editId);return o.inst.map((old,n)=>{const paid=$("ip"+n).checked;return{d:$("id"+n).value||old.d,v:Math.round((+$("iv"+n).value||0)*100)/100,paid,pd:paid?(old.pd||today()):null}})}
const curPlan=()=>redo()?plan():readKeep();
function pickProd(){const v=$("sp").value;if(v.startsWith("c:")){const f=v.slice(2);$("sn").value=$("sb").value+" "+$("sm").value+" – "+f;tmpImg=cph($("sb").value,$("sm").value,f);if(tmpImg)$("sv").src=tmpImg;else $("sv").removeAttribute("src");prev();return}const p=S.products.find(x=>x.id===v);if(!p)return;$("sn").value=p.name;$("sc").value=p.cost;$("sv2").value=p.price;tmpImg=p.img||cph(p.brand,p.model,p.flavor)||"";if(tmpImg)$("sv").src=tmpImg;prev()}
function plan(){
  const price=+$("sv2").value||0,n=Math.max(1,Math.min(36,+$("sq").value||1)),ent=Math.min(price,+$("se").value||0),rest=price-ent,base=Math.floor(rest/n*100)/100,out=[];
  if(ent>0)out.push({d:today(),v:ent,paid:true,pd:today()});
  for(let i=0;i<n;i++){const v=i===n-1?Math.round((rest-base*(n-1))*100)/100:base;if(v>0||!out.length)out.push({d:addDate($("sd").value||today(),i,$("si").value),v,paid:false})}
  return out;
}
function prev(){const c=+$("sc").value||0,p=+$("sv2").value||0,a=curPlan(),sum=Math.round(a.reduce((x,i)=>x+i.v,0)*100)/100,diff=Math.abs(sum-p)>0.009;$("pr").innerHTML=`<div class="sub">Lucro: <b class="${p-c>=0?"ok":"bad"}">${money(p-c)}</b></div>`+a.map((i,k)=>`<div class="inst"><span>${k+1}ª · ${fmt(i.d)}</span><b>${money(i.v)}${i.paid?" ✓":""}</b></div>`).join("")+(diff?`<div class="sub warn" style="margin-top:6px">⚠️ A soma das parcelas (${money(sum)}) é diferente do valor da venda (${money(p)})</div>`:"")}
document.addEventListener("input",e=>{if(e.target.id==="sc")prev()});
function saveSale(){
  const name=$("sn").value.trim(),price=+$("sv2").value;
  if(!name||!price)return alert("Informe o pod e o valor da venda");
  const pv_=$("sp").value,pid=pv_.startsWith("c:")?"":pv_,inst=curPlan();
  if(pv_.startsWith("c:")&&tmpImg&&$("sb").value&&$("sm").value&&cph($("sb").value,$("sm").value,pv_.slice(2))!==tmpImg){setPh(phM($("sb").value,$("sm").value,pv_.slice(2)),tmpImg)}
  if(editId){
    const s=S.sales.find(x=>x.id===editId);
    if(redo()&&s.inst.some(i=>i.paid)&&!confirm("Refazer as parcelas apaga os pagamentos já marcados. Continuar?"))return;
    const sum=Math.round(inst.reduce((x,i)=>x+i.v,0)*100)/100;
    if(Math.abs(sum-price)>0.009&&!confirm("A soma das parcelas ("+money(sum)+") é diferente do valor da venda ("+money(price)+"). Salvar mesmo assim?"))return;
    if(redo())S.proofs=S.proofs.filter(x=>!x.id.startsWith(s.id+"_"));
    Object.assign(s,{pid,name,img:tmpImg,cost:+$("sc").value||0,price,client:$("sl").value.trim(),phone:$("sf").value,note:$("so").value.trim(),date:$("sdt").value||s.date,inst});
    save();closeM();render();return;
  }
  const s={id:uid(),pid,name,img:tmpImg,cost:+$("sc").value||0,price,client:$("sl").value.trim(),phone:$("sf").value,note:$("so").value.trim(),date:today(),inst};
  const p=S.products.find(x=>x.id===pid);if(p&&p.stock>0)p.stock--;
  S.sales.push(s);save();closeM();tab="sales";render();
}
$("fab").onclick=()=>saleForm();

const FB={apiKey:"AIzaSyBuFjPwSwD9Fv7FgT68Pd-r7jfzBvuLH4o",authDomain:"agenda-vendas-9922a.firebaseapp.com",projectId:"agenda-vendas-9922a",appId:"1:345264054186:web:80a2fa55bd025f2b5a55d3"};
let db=null,au=null,cloudOn=false,unsubs=[],last={products:{},sales:{},catalog:{},cphotos:{},expenses:{},closings:{},config:{},proofs:{}},ready={};
function cloudSave(){
  if(!db||!cloudOn)return;
  ["products","sales","catalog","cphotos","expenses","closings","config","proofs"].forEach(c=>{
    const cur={};(S[c]||[]).forEach(x=>cur[x.id]=JSON.stringify(x));
    Object.keys(cur).forEach(id=>{if(last[c][id]!==cur[id]){last[c][id]=cur[id];db.collection(c).doc(id).set(JSON.parse(cur[id])).catch(e=>console.error(e))}});
    Object.keys(last[c]).forEach(id=>{if(!(id in cur)){delete last[c][id];db.collection(c).doc(id).delete().catch(e=>console.error(e))}});
  });
}
function listen(){
  unsubs.forEach(f=>f());
  unsubs=["products","sales","catalog","cphotos","expenses","closings","config","proofs"].map(c=>db.collection(c).onSnapshot(sn=>{
    const a=[];last[c]={};
    sn.forEach(d=>{const x=d.data();x.id=d.id;a.push(x);last[c][d.id]=JSON.stringify(x)});
    S[c]=a;if(!sn.metadata.fromCache)ready[c]=1;if(c==="catalog"&&!a.length&&!sn.metadata.fromCache){S.catalog=seedCat();cloudSave()}if(!sn.metadata.fromCache&&migAll())cloudSave();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!$("modal").innerHTML&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();
  },e=>console.error(e)));
}
function loginUI(){
  $("login").innerHTML=`<div class="modal" style="align-items:center"><div class="sheet" style="border-radius:18px;max-width:380px"><h1>💨 Agenda de Vendas</h1>
  <label>E-mail</label><input id="le" type="email" autocomplete="username"><label>Senha (mín. 6 caracteres)</label><input id="lp" type="password" autocomplete="current-password">
  <div id="lm" class="bad sub" style="margin:8px 0"></div><div class="row"><button onclick="doLogin(0)">Entrar</button><button class="g" onclick="doLogin(1)">Criar conta</button></div></div></div>`;
}
function doLogin(n){
  const e=$("le").value.trim(),p=$("lp").value;
  (n?au.createUserWithEmailAndPassword(e,p):au.signInWithEmailAndPassword(e,p)).catch(x=>$("lm").textContent="Não deu: "+x.code);
}
function initCloud(){
  if(FB.apiKey.startsWith("COLE")||!window.firebase)return;
  firebase.initializeApp(FB);au=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  au.onAuthStateChanged(u=>{
    if(u){
      cloudOn=true;$("login").innerHTML="";
      try{if(!localStorage.getItem(KEY+"_m")){cloudSave();localStorage.setItem(KEY+"_m","1")}}catch(e){}
      listen();render();
    }else{cloudOn=false;unsubs.forEach(f=>f());unsubs=[];loginUI()}
  });
}
if(FB.apiKey.startsWith("COLE")||!window.firebase){if(!CATS().length)S.catalog=seedCat();migAll();save()}
render();initCloud();
</script>
